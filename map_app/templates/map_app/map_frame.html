<div class="rounded-[2.5rem] overflow-hidden border border-slate-200 shadow-xl bg-white mb-8">
    <div class="px-8 py-5 border-b border-slate-50 flex items-center justify-between bg-slate-50/50">
        <h4 class="text-sm font-black text-slate-900 uppercase tracking-widest flex items-center gap-2">
            <i class="fas fa-location-dot text-arion-blue"></i> Google Maps
        </h4>
        <span class="text-[10px] font-bold text-slate-400 uppercase tracking-[0.2em]">{{ property.city }}</span>
    </div>

    <!-- Google Maps Embed Iframe -->
    <div class="w-full h-[300px] bg-slate-100">
        <iframe width="100%" height="100%" style="border:0" loading="lazy" allowfullscreen
            referrerpolicy="no-referrer-when-downgrade"
            src="https://www.google.com/maps/embed/v1/place?key=YOUR_GOOGLE_MAPS_API_KEY&q={{ property.address|urlencode }},{{ property.city|urlencode }}">
        </iframe>
    </div>

    <div class="p-6 bg-white flex items-center gap-4">
        <div class="w-10 h-10 bg-blue-50 rounded-xl flex items-center justify-center text-arion-blue">
            <i class="fas fa-map-marked-alt"></i>
        </div>
        <div class="flex-1">
            <p class="text-xs font-bold text-slate-900">{{ property.address|truncatechars:40 }}</p>
            <p class="text-[10px] text-slate-400 font-medium tracking-wide">Click the map to open in Google Maps.</p>
        </div>
        <a href="https://www.google.com/maps/search/?api=1&query={{ property.address|urlencode }},{{ property.city|urlencode }}"
            target="_blank"
            class="w-8 h-8 rounded-lg bg-slate-50 flex items-center justify-center text-slate-400 hover:text-arion-blue hover:bg-blue-50 transition-all">
            <i class="fas fa-external-link-alt text-xs"></i>
        </a>
    </div>
</div>

<div class="bg-blue-50/50 border border-blue-100/50 rounded-2xl p-4 mb-8">
    <p class="text-[10px] text-blue-600 font-bold leading-relaxed">
        <i class="fas fa-info-circle mr-1"></i>
        Note: You will need to replace <code class="bg-blue-100 px-1 rounded">YOUR_GOOGLE_MAPS_API_KEY</code> in the
        template with your actual API key from the Google Cloud Console.
    </p>
</div>
