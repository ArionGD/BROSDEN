{# BLOCK 5 — ARION ADVANTAGE #}
<section class="py-28 bg-slate-900 relative overflow-hidden">
    <div
        class="absolute top-0 left-0 w-[500px] h-[500px] bg-arion-blue/10 rounded-full blur-[120px] -translate-x-1/2 -translate-y-1/2">
    </div>
    <div
        class="absolute bottom-0 right-0 w-[400px] h-[400px] bg-arion-orange/10 rounded-full blur-[100px] translate-x-1/2 translate-y-1/2">
    </div>

    <div class="container mx-auto px-6 relative z-10">
        <div class="text-center mb-20">
            <span class="text-arion-orange font-black uppercase tracking-widest text-xs mb-4 block">Why Arion</span>
            <h2 class="text-4xl md:text-5xl font-black text-white tracking-tight">The <span
                    class="text-arion-blue">Arion</span> Advantage</h2>
        </div>

        <div class="grid md:grid-cols-3 gap-8">
            {% for feat in home_features %}
            <div
                class="group p-10 bg-white/5 border border-white/10 rounded-[2.5rem] hover:-translate-y-3 hover:bg-white/10 transition-all duration-500">
                <div
                    class="w-16 h-16 bg-white/10 rounded-2xl flex items-center justify-center mb-8 group-hover:scale-110 transition-transform">
                    <i class="fas {{ feat.icon }} text-2xl text-white"></i>
                </div>
                <h3 class="text-xl font-black text-white mb-4">{{ feat.title }}</h3>
                <p class="text-slate-400 font-medium leading-relaxed">{{ feat.desc }}</p>
            </div>
            {% endfor %}
        </div>
    </div>
</section>
