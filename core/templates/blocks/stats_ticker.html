{# BLOCK 2 — STATS TICKER #}
<section class="bg-arion-blue py-8">
    <div class="container mx-auto px-6">
        <div class="grid grid-cols-2 md:grid-cols-4 gap-6 text-center">
            {% for stat in home_stats %}
            <div class="text-white">
                <p class="text-2xl md:text-3xl font-black">{{ stat.value }}</p>
                <p class="text-blue-200 text-xs font-bold uppercase tracking-widest mt-1">{{ stat.label }}</p>
            </div>
            {% endfor %}
        </div>
    </div>
</section>
