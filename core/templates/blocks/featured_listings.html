{# BLOCK 4 — FEATURED LISTINGS #}
<section class="py-24 bg-white">
    <div class="container mx-auto px-6">
        <div class="flex items-end justify-between mb-16">
            <div>
                <span class="text-arion-blue font-black uppercase tracking-widest text-xs mb-3 block">Exclusives</span>
                <h2 class="text-4xl font-black text-slate-900 tracking-tight">Featured <span
                        class="text-arion-orange">Collections</span></h2>
            </div>
            <a href="{% url 'property:browse' %}"
                class="flex items-center gap-2 border-2 border-slate-200 hover:border-arion-blue text-slate-600 hover:text-arion-blue px-6 py-2.5 rounded-2xl font-bold transition-all text-sm">
                View All <i class="fas fa-arrow-right text-xs"></i>
            </a>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            {% for p in featured_properties %}
            <div
                class="group bg-white border border-slate-100 rounded-[2rem] overflow-hidden shadow-sm hover:shadow-2xl hover:-translate-y-1.5 transition-all duration-400">
                <div class="relative h-56 overflow-hidden">
                    <img src="https://images.unsplash.com/photo-1512917774080-9991f1c4c750?auto=format&fit=crop&w=800&q=80"
                        class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700"
                        alt="{{ p.name }}">
                    <div class="absolute top-4 left-4">
                        <span
                            class="bg-arion-blue text-white text-[10px] font-black uppercase px-3 py-1 rounded-full shadow-lg">Arion
                            Verified</span>
                    </div>
                    <div
                        class="absolute bottom-4 right-4 bg-white/95 backdrop-blur px-4 py-2 rounded-2xl font-black text-slate-900 text-lg shadow-lg">
                        {{ p.price }}
                    </div>
                </div>
                <div class="p-7">
                    <h3 class="text-lg font-black text-slate-900 group-hover:text-arion-blue transition-colors mb-2">{{
                        p.name }}</h3>
                    <p class="text-slate-400 font-medium text-sm flex items-center gap-2 mb-5">
                        <i class="fas fa-location-dot text-arion-orange"></i> {{ p.loc }}
                    </p>
                    <div class="flex items-center justify-between pt-5 border-t border-slate-50">
                        <div class="flex gap-4 text-slate-400 font-bold text-sm">
                            <span><i class="fas fa-bed mr-2 text-arion-blue"></i>{{ p.beds }}</span>
                            <span><i class="fas fa-maximize mr-2 text-arion-blue"></i>{{ p.size }}</span>
                        </div>
                        <a href="{% url 'property:browse' %}"
                            class="w-9 h-9 bg-slate-100 hover:bg-arion-blue text-slate-400 hover:text-white rounded-xl flex items-center justify-center transition-all">
                            <i class="fas fa-arrow-right text-xs"></i>
                        </a>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</section>
