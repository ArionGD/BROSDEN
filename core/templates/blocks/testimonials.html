{# BLOCK 7 — TESTIMONIALS #}
<section class="py-28 bg-slate-50 overflow-hidden">
    <div class="container mx-auto px-6">
        <div class="text-center mb-20">
            <span class="text-arion-blue font-black uppercase tracking-widest text-xs mb-4 block">Social Proof</span>
            <h2 class="text-4xl md:text-5xl font-black text-slate-900 tracking-tight">
                Trusted by the <span class="text-arion-orange">Community</span>
            </h2>
        </div>

        <div class="grid md:grid-cols-2 gap-10 max-w-5xl mx-auto">
            {% for t in testimonials %}
            <div
                class="bg-white p-10 rounded-[2.5rem] border border-slate-100 shadow-sm hover:shadow-xl transition-all group">
                <div class="flex gap-1 text-arion-orange mb-6 text-sm">
                    <i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i
                        class="fas fa-star"></i><i class="fas fa-star"></i>
                </div>
                <p class="text-slate-600 font-semibold text-lg leading-relaxed italic mb-8">
                    "{{ t.text }}"
                </p>
                <div class="flex items-center gap-4">
                    <div
                        class="w-14 h-14 rounded-2xl flex items-center justify-center font-black text-white text-xl {% if t.color == 'arion-blue' %}bg-arion-blue{% else %}bg-arion-orange{% endif %}">
                        {{ t.name|slice:":1" }}
                    </div>
                    <div>
                        <p class="font-black text-slate-900">{{ t.name }}</p>
                        <p class="text-sm font-semibold text-slate-400">{{ t.role }}</p>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</section>
