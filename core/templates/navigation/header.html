<header class="bg-white border-b border-slate-200 sticky top-0 z-50">
    <div class="container mx-auto px-4 h-20 flex items-center justify-between">
        <!-- Logo -->
        <a href="{% url 'index' %}" class="flex items-center space-x-2 no-underline">
            <div class="bg-blue-600 p-2 rounded-lg">
                <i class="fas fa-house-chimney text-white text-xl"></i>
            </div>
            <span class="text-2xl font-extrabold tracking-tight text-slate-900">
                Bros<span class="text-blue-600">Den</span><span class="text-slate-400 font-medium">-AV</span>
            </span>
        </a>

        <!-- Navigation Links -->
        <nav class="hidden md:flex items-center space-x-8">
            <a href="{% url 'property:browse' %}"
                class="text-slate-600 hover:text-blue-600 font-medium transition-colors">Browse Properties</a>
            <a href="#" class="text-slate-600 hover:text-blue-600 font-medium transition-colors">Commercial</a>
            <a href="#" class="text-slate-600 hover:text-blue-600 font-medium transition-colors">About Us</a>
        </nav>

        <!-- Portal Actions -->
        <div class="flex items-center space-x-4">
            {% if user.is_authenticated %}
            <div class="flex items-center space-x-6">
                <div class="flex flex-col items-end">
                    <span class="text-[10px] font-black uppercase tracking-tighter text-slate-400">Welcome Back</span>
                    <span class="text-sm font-bold text-slate-900">{{ user.username }}</span>
                </div>
                {% if user.role == 'TENANT' %}
                <a href="{% url 'analytics:tenant_dashboard' %}"
                    class="bg-blue-50 text-blue-600 px-4 py-2 rounded-lg font-bold text-sm">My Dashboard</a>
                {% elif user.role == 'OWNER' %}
                <a href="{% url 'analytics:owner_dashboard' %}"
                    class="bg-slate-900 text-white px-4 py-2 rounded-lg font-bold text-sm">My Dashboard</a>
                {% else %}
                <a href="/admin/" class="bg-red-50 text-red-600 px-4 py-2 rounded-lg font-bold text-sm">Admin Panel</a>
                {% endif %}
                <a href="{% url 'accounts:logout' %}" class="text-slate-400 hover:text-red-500 transition-colors"
                    title="Logout">
                    <i class="fas fa-right-from-bracket text-lg"></i>
                </a>
            </div>
            {% else %}
            <a href="{% url 'tenant:dashboard' %}"
                class="hidden sm:inline-flex items-center px-4 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-100 rounded-lg transition-all border border-transparent hover:border-slate-200">
                <i class="fas fa-user-tie mr-2 text-blue-500"></i> Tenant Portal
            </a>
            <a href="{% url 'owner:dashboard' %}"
                class="inline-flex items-center px-5 py-2.5 text-sm font-bold text-white bg-blue-600 hover:bg-blue-700 rounded-xl transition-all shadow-lg shadow-blue-200">
                <i class="fas fa-key mr-2"></i> Owner Portal
            </a>
            {% endif %}
        </div>
    </div>
</header>
