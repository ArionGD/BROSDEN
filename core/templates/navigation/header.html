<header class="bg-white sticky top-0 z-50 py-4 px-6 md:px-12 border-b border-slate-50">
    <div class="max-w-[1400px] mx-auto flex items-center justify-between">
        <!-- Logo - Inspired by 'Realestate' design -->
        <a href="{% url 'index' %}" class="flex items-center no-underline group">
            <div class="relative flex items-center justify-center w-10 h-10 mr-0.5">
                <span
                    class="text-4xl font-black bg-gradient-to-tr from-purple-600 via-pink-500 to-orange-400 bg-clip-text text-transparent transform group-hover:scale-110 transition-transform italic">R</span>
            </div>
            <span class="text-2xl font-bold tracking-tighter text-slate-900">ealestate</span>
        </a>

        <!-- Navigation Links - Matching the reference image -->
        <nav class="hidden lg:flex items-center space-x-12">
            <a href="{% url 'index' %}"
                class="text-[15px] font-bold text-slate-900 hover:text-[#41b38a] transition-colors no-underline">Home</a>
            <a href="{% url 'property:browse' %}"
                class="text-[15px] font-bold text-slate-900 hover:text-[#41b38a] transition-colors no-underline">Explore</a>
            <a href="{% url 'about' %}"
                class="text-[15px] font-bold text-slate-900 hover:text-[#41b38a] transition-colors no-underline">About</a>
            <a href="{% url 'contact' %}"
                class="text-[15px] font-bold text-slate-900 hover:text-[#41b38a] transition-colors no-underline">Contact</a>
        </nav>

        <!-- Right Side Actions -->
        <div class="flex items-center">
            {% if user.is_authenticated %}
            <!-- User Profile Block with Dropdown -->
            <div class="relative" id="userDropdownContainer">
                <button id="userDropdownBtn"
                    class="flex items-center gap-3 bg-slate-50 hover:bg-slate-100 p-1.5 pr-4 rounded-full transition-all border border-slate-100 group">
                    <!-- Profile Icon Component -->
                    <div
                        class="w-10 h-10 bg-blue-600 rounded-full flex items-center justify-center text-white font-bold shadow-md shadow-blue-100">
                        {{ user.username|slice:":1"|upper }}
                    </div>
                    <div class="text-left hidden md:block">
                        <p class="text-[10px] font-black uppercase tracking-widest text-slate-400 leading-tight">Member
                        </p>
                        <p class="text-sm font-bold text-slate-900 leading-tight">{{ user.username }}</p>
                    </div>
                    <i
                        class="fas fa-chevron-down text-xs text-slate-300 group-hover:text-slate-600 transition-colors ml-1"></i>
                </button>

                <!-- Dropdown Menu -->
                <div id="userDropdownMenu"
                    class="hidden absolute right-0 mt-3 w-56 bg-white rounded-2xl shadow-2xl border border-slate-100 py-2 z-50 animate-in fade-in slide-in-from-top-2 duration-200">
                    <div class="px-5 py-3 border-b border-slate-50 mb-2">
                        <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Signed in as</p>
                        <p class="text-sm font-bold text-slate-900 truncate">{{ user.email }}</p>
                    </div>

                    {% if user.role == 'TENANT' %}
                    <a href="{% url 'analytics:tenant_dashboard' %}"
                        class="flex items-center px-4 py-3 text-sm font-bold text-slate-700 hover:bg-emerald-50 hover:text-emerald-600 transition-colors mx-2 rounded-xl no-underline">
                        <i class="fas fa-chart-line w-6"></i> My Dashboard
                    </a>
                    {% elif user.role == 'OWNER' %}
                    <a href="{% url 'analytics:owner_dashboard' %}"
                        class="flex items-center px-4 py-3 text-sm font-bold text-slate-700 hover:bg-emerald-50 hover:text-emerald-600 transition-colors mx-2 rounded-xl no-underline">
                        <i class="fas fa-chart-pie w-6"></i> Owner Portal
                    </a>
                    {% endif %}

                    <a href="#"
                        class="flex items-center px-4 py-3 text-sm font-bold text-slate-700 hover:bg-slate-50 transition-colors mx-2 rounded-xl no-underline">
                        <i class="fas fa-user-circle w-6 text-slate-400 group-hover:text-blue-500"></i> My Profile
                    </a>

                    <div class="border-t border-slate-50 mt-2 pt-2">
                        <a href="{% url 'accounts:logout' %}"
                            class="flex items-center px-4 py-3 text-sm font-bold text-red-500 hover:bg-red-50 transition-colors mx-2 rounded-xl no-underline">
                            <i class="fas fa-power-off w-6"></i> Sign Out
                        </a>
                    </div>
                </div>
            </div>
            {% else %}
            <!-- Login Button - Green Pill Style matching the image -->
            <a href="{% url 'accounts:login' %}"
                class="bg-[#41b38a] hover:bg-[#369a76] text-white font-bold px-10 py-3 rounded-full shadow-xl shadow-emerald-50/50 transition-all transform hover:-translate-y-0.5 active:scale-95 text-[15px] no-underline">
                Login
            </a>
            {% endif %}
        </div>
    </div>
</header>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const btn = document.getElementById('userDropdownBtn');
        const menu = document.getElementById('userDropdownMenu');

        if (btn && menu) {
            btn.addEventListener('click', function (e) {
                e.stopPropagation();
                menu.classList.toggle('hidden');
            });

            document.addEventListener('click', function (e) {
                if (!btn.contains(e.target) && !menu.contains(e.target)) {
                    menu.classList.add('hidden');
                }
            });
        }
    });
</script>
