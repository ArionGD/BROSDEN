<div class="rounded-[2.5rem] overflow-hidden border border-slate-200 shadow-xl bg-white mb-8">
    <div
        class="px-8 py-6 border-b border-slate-50 flex items-center justify-between bg-gradient-to-r from-slate-50 to-white">
        <div>
            <h4 class="text-sm font-black text-slate-900 uppercase tracking-widest flex items-center gap-2">
                <i class="fas fa-location-crosshairs text-blue-500 animate-spin-slow"></i> 3D Cinematic View
            </h4>
            <div class="h-1 w-12 bg-blue-500 rounded-full mt-1.5"></div>
        </div>
        <div class="flex items-center gap-4 bg-white/50 backdrop-blur-md px-4 py-2 rounded-2xl border border-white">
            <a href="{% url 'map:explore' %}?focus={{ property.id }}"
                class="text-[10px] font-black uppercase text-blue-600 hover:text-indigo-600 flex items-center gap-1.5 transition-all hover:scale-105">
                Full View <i class="fas fa-maximize"></i>
            </a>
            <div class="w-px h-3 bg-slate-200"></div>
            <span class="text-[10px] font-bold text-slate-400 uppercase tracking-[0.2em]">{{ property.city }}</span>
        </div>
    </div>

    <!-- Map Container -->
    <div id="propertyMap" class="h-[400px] w-full z-10 bg-slate-50" data-lat="{{ property.latitude|default:'' }}"
        data-lng="{{ property.longitude|default:'' }}">
    </div>
    <div class="p-6 bg-white flex items-center gap-6">
        <div
            class="w-12 h-12 bg-gradient-to-br from-blue-50 to-indigo-50 rounded-2xl flex items-center justify-center text-blue-600 shadow-inner border border-blue-100/50">
            <i class="fas fa-map-location-dot text-lg"></i>
        </div>
        <div class="flex-1">
            <p class="text-xs font-black text-slate-900 leading-relaxed">{{ property.address }}</p>
            <div class="flex items-center gap-2 mt-1">
                <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest opacity-60">High-End Vector 3D
                    Engine</p>
                <div id="distanceBadge"
                    class="hidden px-2 py-0.5 bg-blue-600 text-white text-[9px] font-black rounded-full animate-bounce">
                    <span id="distanceText">0 km</span>
                </div>
            </div>
        </div>
        <div class="flex items-center gap-4">
            <div class="relative group/search">
                <input type="text" id="poiSearch" placeholder="Check distance to..."
                    class="w-32 md:w-48 py-2.5 px-4 bg-slate-50 border border-slate-100 rounded-xl text-[10px] font-bold focus:w-64 focus:ring-4 focus:ring-blue-100 outline-none transition-all">
                <button onclick="checkDistance()"
                    class="absolute right-2 top-1.5 w-7 h-7 bg-blue-600 text-white rounded-lg flex items-center justify-center hover:bg-blue-700 transition-colors">
                    <i class="fas fa-search text-[8px]"></i>
                </button>
            </div>
            <a href="https://www.google.com/maps/search/?api=1&query={% if property.latitude and property.longitude %}{{ property.latitude }},{{ property.longitude }}{% else %}{{ property.address|urlencode }},{{ property.city|urlencode }}{% endif %}"
                target="_blank"
                class="w-10 h-10 rounded-xl bg-slate-900 text-white flex items-center justify-center hover:bg-blue-600 transition-all group shadow-lg">
                <i class="fas fa-diamond-turn-right text-xs group-hover:scale-110"></i>
            </a>
        </div>
    </div>
</div>

<!-- MapLibre GL JS & CSS -->
<link href='https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.css' rel='stylesheet' />
<script src='https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.js'></script>

<script>
    (function () {
        document.addEventListener('DOMContentLoaded', function () {
            const mapEl = document.getElementById('propertyMap');
            if (!mapEl) return;

            let lat = parseFloat(mapEl.getAttribute('data-lat'));
            let lng = parseFloat(mapEl.getAttribute('data-lng'));

            async function geocode(address) {
                try {
                    const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address)}&limit=1`);
                    const data = await response.json();
                    if (data && data.length > 0) {
                        return [parseFloat(data[0].lon), parseFloat(data[0].lat)];
                    }
                } catch (e) { }
                return null;
            }

            async function initMap() {
                let center = [78.4867, 17.3850];
                if (!isNaN(lat) && !isNaN(lng) && lat !== 0) {
                    center = [lng, lat];
                } else {
                    const coords = await geocode("{{ property.address }}, {{ property.city }}");
                    if (coords) center = coords;
                }

                const map = new maplibregl.Map({
                    container: 'propertyMap',
                    style: 'https://tiles.openfreemap.org/styles/liberty', // High-POI visibility style
                    center: center,
                    zoom: 17,
                    pitch: 0, // Flat 2D View
                    bearing: 0,
                    antialias: true
                });

                map.addControl(new maplibregl.NavigationControl({ showCompass: true }), 'top-right');

                const el = document.createElement('div');
                el.className = 'custom-marker';
                el.innerHTML = `
                    <div class="group relative flex flex-col items-center">
                        <div class="bg-white/95 px-3 py-1.5 rounded-lg shadow-md border border-slate-200 mb-1 transform transition-all group-hover:-translate-y-1">
                            <span class="text-[10px] font-bold text-slate-800 tracking-tight">{{ property.title|truncatechars:15 }}</span>
                        </div>
                        <div class="w-8 h-8 bg-blue-600 rounded-full flex items-center justify-center shadow-lg border-2 border-white relative transition-transform group-hover:scale-110">
                            <i class="fas fa-house text-white text-[10px]"></i>
                        </div>
                    </div>
                `;

                new maplibregl.Marker({ element: el })
                    .setLngLat(center)
                    .addTo(map);

                let searchMarker = null;

                const poiInput = document.getElementById('poiSearch');
                if (poiInput) {
                    poiInput.addEventListener('keypress', (e) => {
                        if (e.key === 'Enter') checkDistance();
                    });
                }

                window.checkDistance = async function () {
                    const query = document.getElementById('poiSearch').value;
                    if (!query) return;

                    try {
                        const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=1`);
                        const data = await response.json();

                        if (data && data.length > 0) {
                            const dest = [parseFloat(data[0].lon), parseFloat(data[0].lat)];

                            if (searchMarker) searchMarker.remove();

                            const el = document.createElement('div');
                            el.className = 'search-marker';
                            el.innerHTML = `<div class="w-8 h-8 bg-red-500 rounded-full border-2 border-white shadow-xl flex items-center justify-center animate-bounce">
                                <i class="fas fa-location-dot text-white text-xs"></i>
                            </div>`;

                            searchMarker = new maplibregl.Marker({ element: el })
                                .setLngLat(dest)
                                .setPopup(new maplibregl.Popup({ offset: 25 }).setHTML(`<p class="text-xs font-black p-2">${data[0].display_name}</p>`))
                                .addTo(map);

                            // Calculate Distance (Haversine)
                            const R = 6371;
                            const dLat = (dest[1] - center[1]) * Math.PI / 180;
                            const dLon = (dest[0] - center[0]) * Math.PI / 180;
                            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                                Math.cos(center[1] * Math.PI / 180) * Math.cos(dest[1] * Math.PI / 180) *
                                Math.sin(dLon / 2) * Math.sin(dLon / 2);
                            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
                            const distance = (R * c).toFixed(2);

                            document.getElementById('distanceBadge').classList.remove('hidden');
                            document.getElementById('distanceText').innerText = `${distance} km away`;

                            map.flyTo({ center: dest, zoom: 15 });
                        }
                    } catch (e) { console.error(e); }
                };

                window.addEventListener('resize', () => map.resize());
            }

            initMap();
        });
    })();
</script>

<style>
    .maplibregl-ctrl-group {
        border-radius: 12px !important;
        border: none !important;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1) !important;
    }

    .maplibregl-ctrl-group button {
        width: 36px !important;
        height: 36px !important;
    }

    .custom-marker {
        cursor: pointer;
    }

    /* Clean UI */
    .maplibregl-ctrl-logo,
    .maplibregl-ctrl-attrib {
        display: none !important;
    }
</style>
