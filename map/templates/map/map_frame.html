<div class="rounded-[2.5rem] overflow-hidden border border-slate-200 shadow-xl bg-white mb-8">
    <div class="px-8 py-5 border-b border-slate-50 flex items-center justify-between bg-slate-50/50">
        <h4 class="text-sm font-black text-slate-900 uppercase tracking-widest flex items-center gap-2">
            <i class="fas fa-location-dot text-arion-blue"></i> 3D Map View
        </h4>
        <span class="text-[10px] font-bold text-slate-400 uppercase tracking-[0.2em]">{{ property.city }}</span>
    </div>

    <!-- Map Container -->
    <div id="propertyMap" class="h-[350px] w-full z-10 bg-slate-50" data-lat="{{ property.latitude|default:'' }}"
        data-lng="{{ property.longitude|default:'' }}">
    </div>
    <div class="p-6 bg-white flex items-center gap-4">
        <div class="w-10 h-10 bg-blue-50 rounded-xl flex items-center justify-center text-arion-blue">
            <i class="fas fa-map-marked-alt"></i>
        </div>
        <div class="flex-1">
            <p class="text-xs font-bold text-slate-900">{{ property.address|truncatechars:40 }}</p>
            <p class="text-[10px] text-slate-400 font-medium tracking-wide">High-performance 3D visual (Open Source).
            </p>
        </div>
        <a href="https://www.google.com/maps/search/?api=1&query={% if property.latitude and property.longitude %}{{ property.latitude }},{{ property.longitude }}{% else %}{{ property.address|urlencode }},{{ property.city|urlencode }}{% endif %}"
            target="_blank"
            class="w-10 h-10 rounded-xl bg-slate-50 flex items-center justify-center text-slate-400 hover:text-blue-600 hover:bg-blue-50 transition-all group overflow-hidden relative">
            <i class="fas fa-map-location-dot transition-transform group-hover:scale-110"></i>
        </a>
    </div>
</div>

<!-- MapLibre GL JS & CSS (Open Source version of Mapbox) -->
<link href='https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.css' rel='stylesheet' />
<script src='https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.js'></script>

<script>
    (function () {
        document.addEventListener('DOMContentLoaded', function () {
            const mapEl = document.getElementById('propertyMap');
            if (!mapEl) return;

            let lat = parseFloat(mapEl.getAttribute('data-lat'));
            let lng = parseFloat(mapEl.getAttribute('data-lng'));

            // Geocoding function using OpenStreetMap Nominatim (Free, No Key)
            async function geocode(address) {
                try {
                    const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address)}&limit=1`);
                    const data = await response.json();
                    if (data && data.length > 0) {
                        return [parseFloat(data[0].lon), parseFloat(data[0].lat)];
                    }
                } catch (e) { console.error('Geocoding failed', e); }
                return null;
            }

            async function initMap() {
                let center = [78.4867, 17.3850]; // Default Hyderabad

                if (!isNaN(lat) && !isNaN(lng) && lat !== 0) {
                    center = [lng, lat];
                } else {
                    const coords = await geocode("{{ property.address }}, {{ property.city }}");
                    if (coords) center = coords;
                }

                // Using OpenFreeMap style - A truly free vector map server
                const map = new maplibregl.Map({
                    container: 'propertyMap',
                    style: 'https://tiles.openfreemap.org/styles/liberty', // Clean, high-end 3D style
                    center: center,
                    zoom: 16,
                    pitch: 45, // 3D Tilt
                    bearing: 0,
                    antialias: true
                });

                // Add navigation controls
                map.addControl(new maplibregl.NavigationControl({
                    showCompass: false
                }), 'top-right');

                // Custom 3D Marker
                const el = document.createElement('div');
                el.className = 'custom-marker';
                el.innerHTML = `
                    <div class="relative flex items-center justify-center">
                        <div class="w-10 h-10 bg-blue-600 rounded-2xl rotate-45 flex items-center justify-center shadow-2xl border-4 border-white transform transition-transform hover:scale-110">
                            <i class="fas fa-house text-white -rotate-45 text-xs"></i>
                        </div>
                        <div class="absolute -bottom-1 w-3 h-3 bg-blue-600 rotate-45 shadow-lg"></div>
                    </div>
                `;

                new maplibregl.Marker({ element: el })
                    .setLngLat(center)
                    .addTo(map);

                // Ensure map resizes correctly
                window.addEventListener('resize', () => map.resize());
            }

            // No Token Needed for MapLibre + OpenFreeMap
            initMap();
        });
    })();
</script>

<style>
    .maplibregl-ctrl-group {
        border-radius: 12px !important;
        border: none !important;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1) !important;
    }

    .maplibregl-ctrl-group button {
        width: 36px !important;
        height: 36px !important;
    }

    .custom-marker {
        cursor: pointer;
    }

    /* Clean UI */
    .maplibregl-ctrl-logo,
    .maplibregl-ctrl-attrib {
        display: none !important;
    }
</style>
