<!-- MapLibre Core -->
<link href='https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.css' rel='stylesheet' />
<script src='https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.js'></script>

<script type="application/json" id="map-data">
    [
        {% for property in properties %}
        {
            "id": {{ property.id|default:0 }},
            "title": "{{ property.title|escapejs }}",
            "price": "{{ property.price|default:0 }}",
            "lat": {{ property.latitude|default:0 }},
            "lng": {{ property.longitude|default:0 }},
            "city": "{{ property.city|escapejs }}",
            "url": "{% url 'property:detail' property.pk %}"
        }{% if not forloop.last %}, {% endif %}
        {% endfor %}
    ]
</script>

<script>
    document.addEventListener('alpine:init', () => {
        Alpine.data('mapApp', () => ({
            isMapOpen: localStorage.getItem('mapExplorerOpen') === 'true',
            isPickerOpen: false,
            activeCardId: null,

            init() {
                this.$watch('isMapOpen', val => {
                    localStorage.setItem('mapExplorerOpen', val);
                    if (val) {
                        setTimeout(() => window.dispatchEvent(new Event('resize-map')), 50);
                    }
                });
            },
            toggleMap() {
                this.isMapOpen = !this.isMapOpen;
            },
            openPicker() {
                this.isPickerOpen = true;
                setTimeout(() => { window.dispatchEvent(new Event('init-picker-map')); }, 100);
            },
            closePicker() {
                this.isPickerOpen = false;
            },
            highlightCard(id) {
                this.activeCardId = id;
            }
        }));

        Alpine.data('mapFilter', () => ({
            showAdvanced: false,
            showSmartMatch: false,
            activeSections: ['basic', 'amenities', 'premium'],
            distWeight: 33,
            costWeight: 33,
            maxPriceRange: parseInt("{{ request_params.max_price|default:25000 }}") || 25000,
            genderFilter: "{{ request_params.gender|default:'ALL' }}",
            sharingLevel: "{{ request_params.sharing_type|default:'' }}",
            furnishFilter: "{{ request_params.furnishing|default:'' }}",
            acOnly: "{{ request_params.ac|yesno:'true,false' }}" === "true",
            mealsFilter: "{{ request_params.meals|yesno:'true,false' }}" === "true",
            wifiFilter: "{{ request_params.wifi|yesno:'true,false' }}" === "true",
            laundryFilter: "{{ request_params.laundry|yesno:'true,false' }}" === "true",
            homeType: "{{ request_params.type|default:'' }}",
            bhkType: "{{ request_params.bedrooms|default:'' }}",
            favoredLocations: [],
            preset: '',
            isFiltered: window.location.search.length > 1,

            toggleSection(section) {
                if (this.activeSections.includes(section)) {
                    this.activeSections = this.activeSections.filter(i => i !== section);
                } else {
                    this.activeSections.push(section);
                }
            },
            addPreset() {
                if (this.preset) {
                    let [coords, label] = this.preset.split('|');
                    let [lat, lng] = coords.split(',').map(Number);
                    this.favoredLocations.push({lat, lng, label});
                    this.preset = '';
                }
            },
            removeLocation(index) {
                this.favoredLocations.splice(index, 1);
            },
            addLocation(detail) {
                this.favoredLocations.push(detail);
            },
            clearFilters() {
                window.location.href = window.location.pathname;
            }
        }));
    });

    let pickerMap = null;
    let pickerMarker = null;
    let selectedLatLng = null;

    // Map Picker Integration
    window.addEventListener('init-picker-map', () => {
        setTimeout(() => {
            if (!pickerMap) {
                // Initialize map on first open
                pickerMap = new maplibregl.Map({
                    container: 'picker-map',
                    style: 'https://tiles.openfreemap.org/styles/bright',
                    center: [72.5714, 23.0225], // Default Ahmedabad
                    zoom: 12
                });
                
                pickerMap.on('click', function(e) {
                    if (pickerMarker) pickerMarker.remove();
                    
                    const el = document.createElement('div');
                    el.className = 'search-marker';
                    el.innerHTML = `<div class="w-6 h-6 bg-red-500 rounded-full border-2 border-white shadow-xl flex items-center justify-center animate-bounce">
                        <i class="fas fa-location-dot text-white text-[10px]"></i>
                    </div>`;
                    
                    pickerMarker = new maplibregl.Marker({ element: el })
                        .setLngLat(e.lngLat)
                        .addTo(pickerMap);
                        
                    selectedLatLng = e.lngLat;
                });
            }
            pickerMap.resize();
        }, 100);
    });

    function confirmMapLocation() {
        if (!selectedLatLng) return alert("Please select a point on the map!");
        const label = prompt("Enter a label for this location (e.g., Office, Home):", "Custom Point");
        if (label) {
            window.dispatchEvent(new CustomEvent('add-location', { 
                detail: { lat: selectedLatLng.lat, lng: selectedLatLng.lng, label: label } 
            }));
            // Dispatch Alpine close event
            window.dispatchEvent(new Event('close-picker'));
        }
    }

    let mapNeedsGeometryUpdate = true;
    let initialBounds = null;
    let initialFocusId = null;

    window.addEventListener('resize-map', () => {
        if (mainMap) {
            mainMap.resize();
            // First time we show the map, we apply bounds/focus so it calculates correctly
            if (mapNeedsGeometryUpdate) {
                if (initialFocusId) {
                    const focusProp = window.mapProperties ? window.mapProperties.find(p => p.id == initialFocusId) : null;
                    if (focusProp) {
                        mainMap.setCenter([focusProp.lng, focusProp.lat]);
                        mainMap.setZoom(16);
                    }
                } else if (initialBounds) {
                    mainMap.fitBounds(initialBounds, {
                        padding: {top: 80, bottom: 80, left: 80, right: 80},
                        maxZoom: 15,
                        animate: false
                    });
                }
                mapNeedsGeometryUpdate = false;
            }
        }
    });

    async function runSmartMatch(w_dist, w_price, locs, btn) {
        if (locs.length === 0) return alert("Please add at least one favored location!");
        
        const originalText = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> CALCULATING CENTER...';

        // Calculate Average Centroid
        const avgLat = locs.reduce((sum, loc) => sum + loc.lat, 0) / locs.length;
        const avgLng = locs.reduce((sum, loc) => sum + loc.lng, 0) / locs.length;

        const w_rating = 100 - (parseInt(w_dist) + parseInt(w_price));

        try {
            const response = await fetch(`/map/smart-api/?lat=${avgLat}&lng=${avgLng}&w_dist=${w_dist}&w_price=${w_price}&w_rating=${w_rating}`);
            const data = await response.json();
            if (data.results) highlightMapMatches(data.results);
        } catch (error) {
            console.error('Smart Match failed:', error);
        } finally {
            btn.disabled = false;
            btn.innerHTML = originalText;
        }
    }

    const markers = {};
    let mainMap = null;

    function focusOnMap(id, lat, lng) {
        if (!mainMap) return;
        
        // Ensure map is open using alpine event
        window.dispatchEvent(new Event('toggle-map'));
        mapNeedsGeometryUpdate = false;

        // Scroll to map — works for both portal and public pages
        setTimeout(() => {
            const target = document.getElementById('spatial-map-block');
            if (!target) return;
            const portalMain = document.getElementById('portal-main');
            if (portalMain) {
                portalMain.scrollTo({ top: target.offsetTop - 20, behavior: 'smooth' });
            } else {
                target.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }, 120);

        // Visual feedback on card via Alpine
        window.dispatchEvent(new CustomEvent('highlight-card', { detail: id }));

        mainMap.flyTo({
            center: [lng, lat],
            zoom: 16,
            essential: true
        });

        const entry = markers[id];
        if (entry) {
            entry.marker.togglePopup();
        }
    }

    function highlightMapMatches(results) {
        results.forEach(res => {
            const markerData = markers[res.id];
            if (!markerData) return;

            const { marker, element } = markerData;
            const badge = element.querySelector('.smart-score-badge');
            if(badge) {
                badge.innerHTML = `<i class="fas fa-star text-yellow-300"></i> ${res.score}%`;
                badge.classList.remove('hidden');
            }
        });
    }

    document.addEventListener('DOMContentLoaded', function () {
        const dataEl = document.getElementById('map-data');
        if(!dataEl) return;

        const properties = JSON.parse(dataEl.textContent);
        const mapEl = document.getElementById('fullScreenMap');
        if(!mapEl) return;

        const focusId = mapEl.getAttribute('data-focus');
        const searchQuery = mapEl.getAttribute('data-query');

        let center = [72.5714, 23.0225]; // Default Ahmedabad
        let zoom = 12;
        let bounds = null;

        if (properties.length > 0) {
            bounds = new maplibregl.LngLatBounds();
            properties.forEach(p => bounds.extend([p.lng, p.lat]));
        }

        window.mapProperties = properties;
        initialBounds = bounds;
        initialFocusId = focusId;

        mainMap = new maplibregl.Map({
            container: 'fullScreenMap',
            style: 'https://tiles.openfreemap.org/styles/bright', 
            center: center,
            zoom: zoom,
            pitch: 0, 
            bearing: 0,
            dragPitch: false, 
            antialias: true
        });

        // Geocode search query if properties are empty or not focused on a property
        if (searchQuery && !focusId) {
            fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(searchQuery + ', Ahmedabad')}&limit=1`)
                .then(res => res.json())
                .then(data => {
                    if (data && data.length > 0) {
                        const dest = [parseFloat(data[0].lon), parseFloat(data[0].lat)];
                        mainMap.flyTo({ center: dest, zoom: 14 });
                    }
                });
        }

        const map = mainMap;

        // Dynamic Google Maps Aesthetic Override (White Roads)
        map.on('style.load', () => {
            const layers = map.getStyle().layers;
            layers.forEach(layer => {
                if (layer['source-layer'] === 'transportation' || (layer.id && layer.id.includes('road'))) {
                    if (layer.type === 'line') {
                        if (layer.id.includes('casing') || layer.id.includes('outline')) {
                            map.setPaintProperty(layer.id, 'line-color', '#e2e8f0'); // slate-200 borders
                        } else {
                            map.setPaintProperty(layer.id, 'line-color', '#ffffff'); // white roads exactly like Google
                        }
                    }
                }
            });
        });

        // Geometry fits are now handled in toggleMapExplorer
        // to prevent rendering glitches when container is display: none.

        map.addControl(new maplibregl.NavigationControl({ showCompass: true }), 'bottom-right');

        properties.forEach(prop => {
            const el = document.createElement('div');
            el.className = 'map-marker';
            el.innerHTML = `
                <div class="group relative flex flex-col items-center cursor-pointer">
                    <!-- Hover Title Bubble -->
                    <div class="absolute bottom-[calc(100%+6px)] left-1/2 -translate-x-1/2 opacity-0 group-hover:opacity-100 transition-all duration-300 pointer-events-none z-50 transform translate-y-1 group-hover:translate-y-0">
                        <div class="bg-slate-900 text-white text-[9px] font-black px-3 py-1.5 rounded-lg shadow-2xl whitespace-nowrap flex items-center gap-1.5 border border-slate-800">
                            <i class="fas fa-building text-blue-400 text-[8px]"></i>
                            ${prop.title}
                        </div>
                        <div class="w-2 h-2 bg-slate-900 rotate-45 mx-auto -mt-1 border-r border-b border-slate-800"></div>
                    </div>
                    
                    <!-- AI Score Badge (Hidden by default) -->
                    <div class="smart-score-badge hidden absolute -top-8 left-1/2 -translate-x-1/2 bg-blue-600 text-white px-2 py-0.5 rounded-full text-[8px] font-black shadow-lg border border-white/20 whitespace-nowrap z-30">
                    </div>

                    <div class="relative">
                        <div class="absolute -inset-0.5 bg-blue-500/10 rounded-full blur-sm opacity-0 group-hover:opacity-100 transition-opacity"></div>
                        <div class="bg-white px-3 py-1.5 rounded-full shadow-lg border border-slate-100 transition-all duration-300 flex items-center gap-1.5 group-hover:border-blue-500 group-hover:scale-105 group-hover:shadow-blue-100 active:scale-95 relative bg-white z-10">
                            <span class="text-[9px] font-black text-blue-500 tracking-tighter">₹</span>
                            <span class="text-[10px] font-black text-slate-900 tracking-tight">${Number(prop.price).toLocaleString('en-IN')}</span>
                        </div>
                    </div>
                </div>
            `;

            const popup = new maplibregl.Popup({ 
                offset: 25,
                closeButton: false,
                className: 'vibrant-popup'
            })
            .setHTML(`
                <div class="p-0 overflow-hidden rounded-[1.2rem] min-w-[160px]">
                    <div class="bg-gradient-to-br from-blue-600 to-indigo-700 p-3 text-white">
                        <h4 class="text-xs font-black mb-0.5 leading-tight">${prop.title}</h4>
                        <p class="text-[8px] font-bold opacity-80 uppercase tracking-widest">${prop.city}</p>
                    </div>
                    <div class="p-3 bg-white">
                        <div class="flex items-center justify-between mb-3">
                            <div>
                                <p class="text-[7px] font-black text-slate-400 uppercase leading-none mb-1">Monthly Rent</p>
                                <p class="text-xs font-black text-slate-900">₹${Number(prop.price).toLocaleString('en-IN')}</p>
                            </div>
                            <div class="w-6 h-6 rounded-full bg-blue-50 text-blue-500 flex items-center justify-center">
                                <i class="fas fa-key text-[8px]"></i>
                            </div>
                        </div>
                        <a href="${prop.url}" class="block text-center py-2 bg-slate-900 text-white rounded-lg text-[9px] font-black no-underline shadow-lg hover:bg-blue-600 transition-all flex items-center justify-center gap-2">
                            EXPLORE SUITE <i class="fas fa-arrow-right text-[7px]"></i>
                        </a>
                    </div>
                </div>
            `);

            const marker = new maplibregl.Marker({ element: el })
                .setLngLat([prop.lng, prop.lat])
                .setPopup(popup)
                .addTo(map);

            // Side-panel sync
            marker.getElement().addEventListener('click', () => {
                window.dispatchEvent(new CustomEvent('highlight-card', { detail: prop.id }));
                const card = document.getElementById(`hybrid-card-${prop.id}`);
                if (card) {
                    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            });

            // Store for AI updates
            markers[prop.id] = { marker, element: el };
        });

        let searchMarker = null;

        window.searchMap = async function () {
            const queryInput = document.getElementById('mapSearch');
            const query = queryInput ? queryInput.value : '';
            if (!query) return;
            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query + ', Ahmedabad')}&limit=1`);
                const data = await response.json();
                if (data && data.length > 0) {
                    const dest = [parseFloat(data[0].lon), parseFloat(data[0].lat)];

                    if (searchMarker) searchMarker.remove();

                    const el = document.createElement('div');
                    el.className = 'search-marker';
                    el.innerHTML = `<div class="w-10 h-10 bg-red-500 rounded-full border-4 border-white shadow-2xl flex items-center justify-center animate-bounce">
                        <i class="fas fa-location-dot text-white text-sm"></i>
                    </div>`;

                    searchMarker = new maplibregl.Marker({ element: el })
                        .setLngLat(dest)
                        .setPopup(new maplibregl.Popup({ offset: 25 }).setHTML(`
                            <div class="p-3">
                                <p class="text-[10px] font-black uppercase text-slate-400 mb-1">Search Result</p>
                                <p class="text-xs font-bold text-slate-800">${data[0].display_name}</p>
                            </div>
                        `))
                        .addTo(map);

                    map.flyTo({
                        center: dest,
                        zoom: 15,
                        essential: true
                    });

                    searchMarker.togglePopup();
                }
            } catch (e) { }
        };
        // Card Click Delegation
        document.addEventListener('click', function(e) {
            const card = e.target.closest('.hybrid-card');
            if (card) {
                const id = card.dataset.id;
                const lat = parseFloat(card.dataset.lat);
                const lng = parseFloat(card.dataset.lng);
                if (id && !isNaN(lat) && !isNaN(lng)) {
                    focusOnMap(id, lat, lng);
                }
            }
        });
    });
</script>

<style>
    .maplibregl-popup-content {
        border-radius: 20px !important;
        padding: 0 !important;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25) !important;
        overflow: hidden;
    }

    .map-marker {
        cursor: pointer;
    }

    .maplibregl-ctrl-logo,
    .maplibregl-ctrl-attrib {
        display: none !important;
    }
</style>
