<!-- Location Picker Modal -->
<div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[9999] flex items-center justify-center p-4" 
     x-show="isPickerOpen" style="display: none;" x-transition.opacity>
    <div class="bg-white rounded-3xl w-full max-w-3xl overflow-hidden shadow-2xl transition-all" 
         x-show="isPickerOpen" x-transition:enter="transition ease-out duration-300 transform" x-transition:enter-start="opacity-0 translate-y-4 scale-95" x-transition:enter-end="opacity-100 translate-y-0 scale-100" x-transition:leave="transition ease-in duration-200 transform" x-transition:leave-start="opacity-100 translate-y-0 scale-100" x-transition:leave-end="opacity-0 translate-y-4 scale-95" @click.away="$dispatch('close-picker')">
        <div class="p-6 border-b border-slate-100 flex items-center justify-between">
            <h3 class="text-lg font-black text-slate-900 flex items-center gap-3">
                <i class="fas fa-location-dot text-blue-600"></i> Pin Custom Location
            </h3>
            <button @click="$dispatch('close-picker')" class="w-9 h-9 rounded-xl bg-slate-100 text-slate-400 hover:text-red-500 hover:bg-red-50 flex items-center justify-center transition-all">
                <i class="fas fa-xmark"></i>
            </button>
        </div>
        <div id="picker-map" style="height:420px;width:100%;"></div>
        <div class="p-5 border-t border-slate-100 flex justify-between items-center">
            <p class="text-xs text-slate-400 font-bold"><i class="fas fa-hand-pointer mr-2 text-blue-400"></i>Click to drop a pin</p>
            <div class="flex gap-3">
                <button type="button" @click="$dispatch('close-picker')" class="px-5 py-3 text-xs font-black text-slate-400 hover:text-slate-800 uppercase tracking-widest transition-colors">Cancel</button>
                <button type="button" onclick="confirmMapLocation()" class="px-8 py-3 bg-slate-900 text-white rounded-xl text-xs font-black uppercase tracking-widest hover:bg-black transition-all">
                    Set Location <i class="fas fa-chevron-right text-[9px] ml-1"></i>
                </button>
            </div>
        </div>
    </div>
</div>
