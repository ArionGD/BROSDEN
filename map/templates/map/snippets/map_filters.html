<form method="GET" action="{{ request.path }}" 
    class="flex flex-col gap-6 w-full">
    
    <!-- Top Row: Global Fast Filters -->
    <div class="flex flex-wrap gap-4 items-center">
        <!-- Text Search -->
        <div class="flex-1 min-w-[200px] relative">
            <i class="fas fa-search absolute left-5 top-1/2 -translate-y-1/2 text-slate-300"></i>
            <input type="text" name="q" value="{{ request_params.q|default:'' }}" placeholder="Search areas, landmarks, suites..."
                class="w-full pl-14 pr-6 py-4 bg-white/50 rounded-[1.2rem] border border-slate-100 outline-none focus:ring-4 focus:ring-blue-100/50 transition-all text-sm font-bold placeholder:text-slate-300">
        </div>

        <!-- City Select -->
        <div class="relative">
            <select name="city" class="appearance-none pl-6 pr-12 py-4 bg-white/50 rounded-[1.2rem] border border-slate-100 font-black text-slate-600 outline-none text-xs uppercase tracking-widest cursor-pointer hover:bg-white transition-colors">
                <option value="All Cities">All Cities</option>
                {% for city in cities %}
                <option value="{{ city }}" {% if city == request_params.city %}selected{% endif %}>{{ city }}</option>
                {% endfor %}
            </select>
            <i class="fas fa-chevron-down absolute right-5 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none text-[10px]"></i>
        </div>

        <!-- Advanced Toggle -->
        <button type="button" onclick="toggleAdvancedFilters()" 
            class="px-6 py-4 bg-slate-900 text-white rounded-[1.2rem] font-black flex items-center gap-3 hover:bg-black transition-all border border-black group text-xs uppercase tracking-[0.2em] shadow-xl shadow-slate-200">
            <i class="fas fa-sliders-h transition-transform duration-500" id="adv-filter-icon"></i> Filtering Suite
        </button>

        <!-- Map Explorer Toggle -->
        <button type="button" onclick="toggleMapExplorer()" id="map-explorer-toggle"
            class="px-6 py-4 bg-white border border-slate-200 text-slate-900 rounded-[1.2rem] font-black flex items-center gap-3 hover:bg-slate-50 transition-all text-xs uppercase tracking-[0.2em]">
            <i class="fas fa-earth-asia text-blue-600"></i> Map Explorer
        </button>

        <!-- Apply Button -->
        <button type="submit" class="px-10 py-4 bg-blue-600 text-white rounded-[1.2rem] font-black shadow-xl shadow-blue-100 hover:bg-blue-700 transition-all text-xs uppercase tracking-[0.2em] transform active:scale-95">
            Refresh Results
        </button>
    </div>

    <!-- Advanced Filters Suite (Toggleable) -->
    <div id="advanced-filters-panel" class="hidden animate-in fade-in slide-in-from-top-4 duration-500 flex flex-col gap-10 pt-8 border-t border-slate-100">
        
        <!-- SECTION 1: Logistics -->
        <div class="space-y-4">
            <h4 class="text-[10px] font-black text-slate-400 uppercase tracking-[0.3em] flex items-center gap-3">
                <span class="w-8 h-px bg-slate-100"></span> 1. Logistics
            </h4>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-6">
                <div class="space-y-2">
                    <label class="text-[9px] font-black uppercase text-slate-500 tracking-widest">Monthly Budget</label>
                    <div class="flex gap-2">
                        <input type="number" name="min_price" value="{{ request_params.min_price|default:'' }}" placeholder="Min" class="w-full px-4 py-2.5 bg-slate-50 rounded-xl border border-slate-100 text-[10px] font-bold outline-none focus:ring-2 focus:ring-blue-100">
                        <input type="number" name="max_price" value="{{ request_params.max_price|default:'' }}" placeholder="Max" class="w-full px-4 py-2.5 bg-slate-50 rounded-xl border border-slate-100 text-[10px] font-bold outline-none focus:ring-2 focus:ring-blue-100">
                    </div>
                </div>
                <div class="space-y-2">
                    <label class="text-[9px] font-black uppercase text-slate-500 tracking-widest">Property Type</label>
                    <select name="type" class="w-full px-4 py-2.5 bg-slate-50 rounded-xl border border-slate-100 text-[10px] font-bold outline-none">
                        <option value="">Any Type</option>
                        <option value="APARTMENT" {% if request_params.type == 'APARTMENT' %}selected{% endif %}>Apartment</option>
                        <option value="PG" {% if request_params.type == 'PG' %}selected{% endif %}>PG / Hostel</option>
                        <option value="SHARED" {% if request_params.type == 'SHARED' %}selected{% endif %}>Shared</option>
                    </select>
                </div>
                <div class="space-y-2">
                    <label class="text-[9px] font-black uppercase text-slate-500 tracking-widest">Gender</label>
                    <select name="gender" class="w-full px-4 py-2.5 bg-slate-50 rounded-xl border border-slate-100 text-[10px] font-bold outline-none">
                        <option value="">Any</option>
                        <option value="BOYS" {% if request_params.gender == 'BOYS' %}selected{% endif %}>Boys</option>
                        <option value="GIRLS" {% if request_params.gender == 'GIRLS' %}selected{% endif %}>Girls</option>
                        <option value="COED" {% if request_params.gender == 'COED' %}selected{% endif %}>Co-ed</option>
                    </select>
                </div>
                <div class="space-y-2">
                    <label class="text-[9px] font-black uppercase text-slate-500 tracking-widest">Availability</label>
                    <input type="date" name="available_from" value="{{ request_params.available_from|default:'' }}" class="w-full px-4 py-2.5 bg-slate-50 rounded-xl border border-slate-100 text-[10px] font-bold outline-none">
                </div>
            </div>
        </div>

        <!-- SECTION 2: PG & Specialist -->
        <div class="space-y-4">
            <h4 class="text-[10px] font-black text-emerald-500 uppercase tracking-[0.3em] flex items-center gap-3">
                <span class="w-8 h-px bg-emerald-100"></span> 2. PG Specialist
            </h4>
            <div class="grid grid-cols-2 lg:grid-cols-4 gap-6">
                <div class="space-y-2">
                    <label class="text-[9px] font-black uppercase text-slate-500 tracking-widest">Occupancy</label>
                    <select name="sharing_type" class="w-full px-4 py-2.5 bg-slate-50 rounded-xl border border-slate-100 text-[10px] font-bold outline-none">
                        <option value="">Any Sharing</option>
                        <option value="SINGLE">Private</option>
                        <option value="DOUBLE">2-Sharing</option>
                        <option value="TRIPLE">3-Sharing</option>
                    </select>
                </div>
                <div class="flex flex-col justify-center gap-3">
                    <label class="flex items-center gap-2 cursor-pointer group">
                        <input type="checkbox" name="breakfast" class="w-4 h-4 rounded border-slate-300 text-emerald-500 focus:ring-emerald-500">
                        <span class="text-[10px] font-bold text-slate-600">Breakfast</span>
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer group">
                        <input type="checkbox" name="full_meals" class="w-4 h-4 rounded border-slate-300 text-emerald-500 focus:ring-emerald-500">
                        <span class="text-[10px] font-bold text-slate-600">Full Meals</span>
                    </label>
                </div>
                <div class="grid grid-cols-2 gap-4 lg:col-span-2">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" name="wifi" class="w-3.5 h-3.5 rounded text-emerald-500">
                        <span class="text-[9px] font-bold text-slate-500 uppercase">Wi-Fi</span>
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" name="laundry" class="w-3.5 h-3.5 rounded text-emerald-500">
                        <span class="text-[9px] font-bold text-slate-500 uppercase">Laundry</span>
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" name="study_table" class="w-3.5 h-3.5 rounded text-emerald-500">
                        <span class="text-[9px] font-bold text-slate-500 uppercase">Study Desk</span>
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" name="no_curfew" class="w-3.5 h-3.5 rounded text-emerald-500">
                        <span class="text-[9px] font-bold text-slate-500 uppercase">No Curfew</span>
                    </label>
                </div>
            </div>
        </div>

        <!-- SECTION 3: Real Estate -->
        <div class="space-y-4">
            <h4 class="text-[10px] font-black text-indigo-500 uppercase tracking-[0.3em] flex items-center gap-3">
                <span class="w-8 h-px bg-indigo-100"></span> 3. Real Estate
            </h4>
            <div class="grid grid-cols-2 lg:grid-cols-4 gap-6">
                <div class="space-y-2">
                    <label class="text-[9px] font-black uppercase text-slate-500 tracking-widest">BHK Config</label>
                    <select name="bedrooms" class="w-full px-4 py-2.5 bg-slate-50 rounded-xl border border-slate-100 text-[10px] font-bold outline-none">
                        <option value="">Any BHK</option>
                        <option value="1">1 BHK</option>
                        <option value="2">2 BHK</option>
                        <option value="3">3 BHK+</option>
                    </select>
                </div>
                <div class="space-y-2">
                    <label class="text-[9px] font-black uppercase text-slate-500 tracking-widest">Furnishing</label>
                    <select name="furnishing" class="w-full px-4 py-2.5 bg-slate-50 rounded-xl border border-slate-100 text-[10px] font-bold outline-none">
                        <option value="">Any Status</option>
                        <option value="FULLY">Fully</option>
                        <option value="SEMI">Semi</option>
                        <option value="UNFURNISHED">Unfurnished</option>
                    </select>
                </div>
                <div class="space-y-2">
                    <label class="text-[9px] font-black uppercase text-slate-500 tracking-widest">Parking</label>
                    <select name="parking" class="w-full px-4 py-2.5 bg-slate-50 rounded-xl border border-slate-100 text-[10px] font-bold outline-none">
                        <option value="">Any</option>
                        <option value="OPEN">Open</option>
                        <option value="COVERED">Covered</option>
                    </select>
                </div>
                <div class="flex items-end">
                    <label class="flex items-center gap-2 cursor-pointer bg-indigo-50 px-4 py-2.5 rounded-xl border border-indigo-100 w-full hover:bg-indigo-100 transition-colors">
                        <input type="checkbox" name="bachelors_allowed" class="w-4 h-4 rounded text-indigo-600">
                        <span class="text-[9px] font-black text-indigo-700 uppercase pt-0.5">Bachelor Safe</span>
                    </label>
                </div>
            </div>
        </div>

        <!-- SECTION 4: AI Proximity -->
        <div class="pt-6 border-t border-slate-100">
            <div class="flex flex-col lg:flex-row gap-8 items-start">
                <div class="lg:w-1/3 space-y-4">
                    <div class="bg-gradient-to-br from-slate-900 to-slate-800 p-6 rounded-3xl shadow-xl flex flex-col gap-4 relative overflow-hidden group">
                        <i class="fas fa-wand-magic-sparkles absolute -right-4 -bottom-4 text-7xl text-white opacity-10 group-hover:scale-110 transition-transform duration-500"></i>
                        <div>
                            <h5 class="text-white font-black text-sm uppercase tracking-widest">Smart Match</h5>
                            <p class="text-slate-400 text-[9px] font-bold mt-1 uppercase tracking-tighter">AI-POWERED PROXIMITY SCAN</p>
                        </div>
                        <button type="button" onclick="toggleSmartMatch()" class="w-full py-3 bg-blue-600 text-white rounded-xl text-[10px] font-black uppercase tracking-widest hover:bg-blue-500 transition-all shadow-lg shadow-blue-900/40">
                            Configure Weights
                        </button>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-4">
                        <label class="flex items-center gap-3 bg-white p-4 rounded-2xl border border-slate-100 cursor-pointer hover:border-orange-500 transition-all group shadow-sm">
                            <input type="checkbox" name="verified" class="w-4 h-4 rounded text-orange-500">
                            <span class="text-[9px] font-black text-slate-800 uppercase tracking-tighter">Verified</span>
                        </label>
                        <label class="flex items-center gap-3 bg-white p-4 rounded-2xl border border-slate-100 cursor-pointer hover:border-orange-500 transition-all group shadow-sm">
                            <input type="checkbox" name="pets" class="w-4 h-4 rounded text-orange-500">
                            <span class="text-[9px] font-black text-slate-800 uppercase tracking-tighter">Pet OK</span>
                        </label>
                    </div>
                </div>

                <div id="smart-match-panel" class="hidden flex-1 animate-in fade-in zoom-in-95 duration-500 bg-slate-50 p-6 rounded-3xl border border-slate-200 space-y-8">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                        <div class="space-y-4">
                            <label class="text-[10px] font-black uppercase tracking-[0.2em] text-slate-400 flex items-center justify-between">
                                Favored Locations
                                <span class="bg-blue-100 text-blue-600 px-2 py-0.5 rounded text-[8px] font-black" id="location-count">0 Added</span>
                            </label>
                            
                            <!-- Location Adder -->
                            <div class="flex gap-2">
                                <select id="target-preset" class="flex-1 px-4 py-3 bg-white rounded-xl border border-slate-200 font-bold text-slate-700 outline-none text-[10px] shadow-sm">
                                    <option value="">-- Add Preset --</option>
                                    <option value="23.0371,72.5445" data-label="Gujarat University">Gujarat University</option>
                                    <option value="23.0238,72.5273" data-label="Shivranjani Cross Roads">Shivranjani Cross Roads</option>
                                    <option value="23.0225,72.5714" data-label="Lal Darwaja">Lal Darwaja</option>
                                    <option value="23.0497,72.5117" data-label="SG Highway">SG Highway</option>
                                </select>
                                <button type="button" onclick="addLocationFromPreset()" class="p-3 bg-slate-900 text-white rounded-xl hover:bg-black transition-all">
                                    <i class="fas fa-plus text-xs"></i>
                                </button>
                                <button type="button" onclick="openMapPicker()" class="p-3 bg-blue-600 text-white rounded-xl hover:bg-blue-700 transition-all shadow-lg shadow-blue-100">
                                    <i class="fas fa-map-pin text-xs"></i>
                                </button>
                            </div>

                            <!-- Locations List Container -->
                            <div id="target-locations-list" class="flex flex-col gap-2 max-h-[150px] overflow-y-auto pr-2 portal-scroll">
                                <!-- Dynamic entries will appear here -->
                                <div class="text-[9px] font-bold text-slate-400 text-center py-4 bg-white/30 rounded-xl border border-dashed border-slate-200" id="no-locations-hint">
                                    Add your daily destinations to find the center
                                </div>
                            </div>
                        </div>
                        <div class="space-y-6">
                            <div class="space-y-3">
                                <div class="flex justify-between items-center text-[10px] font-black uppercase tracking-widest text-slate-500">
                                    <span>Distance Weight</span>
                                    <span id="w-dist-val" class="text-blue-600">33%</span>
                                </div>
                                <input type="range" id="w-dist" min="0" max="100" value="33" class="w-full h-1.5 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-blue-600" oninput="updateWeightLabels()">
                            </div>
                            <div class="space-y-3">
                                <div class="flex justify-between items-center text-[10px] font-black uppercase tracking-widest text-slate-500">
                                    <span>Rent Weight</span>
                                    <span id="w-cost-val" class="text-blue-600">33%</span>
                                </div>
                                <input type="range" id="w-cost" min="0" max="100" value="33" class="w-full h-1.5 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-blue-600" oninput="updateWeightLabels()">
                            </div>
                        </div>
                    </div>
                    <button type="button" onclick="runSmartMatch()" id="run-match-btn" class="w-full py-4 bg-slate-900 text-white rounded-2xl font-black text-[11px] uppercase tracking-[0.3em] hover:bg-black transition-all shadow-xl">
                        Calculate Best Scenarios
                    </button>
                </div>
            </div>
        </div>
    </div>
</form>
