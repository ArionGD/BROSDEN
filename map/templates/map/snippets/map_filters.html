<form method="GET" action="{{ request.path }}" class="flex flex-col gap-6 w-full" x-data="mapFilter()"
    @add-location.window="addLocation($event.detail)">

    <!-- Top Row: Global Fast Filters -->
    <div class="flex flex-wrap gap-4 items-center">
        <!-- Text Search -->
        <div class="flex-1 min-w-[200px] relative">
            <i class="fas fa-search absolute left-5 top-1/2 -translate-y-1/2 text-slate-300"></i>
            <input type="text" name="q" value="{{ request_params.q|default:'' }}"
                placeholder="Search areas, landmarks, suites..."
                class="w-full pl-14 pr-6 py-4 bg-white/50 rounded-[1.2rem] border border-slate-100 outline-none focus:ring-4 focus:ring-blue-100/50 transition-all text-sm font-bold placeholder:text-slate-300">
        </div>

        <!-- City Select -->
        <div class="relative">
            <select name="city"
                class="appearance-none pl-6 pr-12 py-4 bg-white/50 rounded-[1.2rem] border border-slate-100 font-black text-slate-600 outline-none text-xs uppercase tracking-widest cursor-pointer hover:bg-white transition-colors">
                <option value="All Cities">All Cities</option>
                {% for city in cities %}
                <option value="{{ city }}" {% if city == request_params.city %}selected{% endif %}>{{ city }}</option>
                {% endfor %}
            </select>
            <i
                class="fas fa-chevron-down absolute right-5 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none text-[10px]"></i>
        </div>

        <!-- Map Explorer Toggle -->
        <button type="button" @click="$dispatch('toggle-map')"
            class="px-6 py-4 bg-white border border-slate-200 text-slate-900 rounded-[1.2rem] font-black flex items-center gap-3 hover:bg-slate-50 transition-all text-xs uppercase tracking-[0.2em]">
            <i class="fas fa-earth-asia text-blue-600"></i> Map Explorer
        </button>

        <!-- AI Smart Search Button (Round, Dark Navy Blur) -->
        <button type="button" @click="showSmartMatch = !showSmartMatch"
            class="w-[58px] h-[58px] bg-slate-900/90 backdrop-blur-xl text-white rounded-full flex items-center justify-center hover:bg-slate-900 transition-all shadow-xl group border border-slate-800/80 transform active:scale-95">
            <i
                class="fas fa-wand-magic-sparkles text-blue-400 group-hover:scale-125 transition-transform duration-500"></i>
        </button>

        <!-- Advanced Toggle -->
        <button type="button" @click="showAdvanced = !showAdvanced"
            class="px-6 py-4 bg-slate-900 text-white rounded-[1.2rem] font-black flex items-center gap-3 hover:bg-black transition-all border border-black group text-xs uppercase tracking-[0.2em] shadow-xl shadow-slate-200">
            <i class="fas fa-sliders-h transition-transform duration-500" :class="showAdvanced ? 'rotate-180' : ''"></i>
            Filter
        </button>

        <!-- Dynamic Action Button (Apply/Clear) -->
        <button type="submit" @click="isFiltered ? ($event.preventDefault(), clearFilters()) : null"
            class="px-10 py-4 bg-slate-900 border border-slate-900 text-white rounded-[1.2rem] font-black shadow-xl shadow-slate-200 hover:bg-black transition-all text-xs uppercase tracking-[0.2em] transform active:scale-95">
            <span x-text="isFiltered ? 'Clear' : 'Apply'"></span>
        </button>
    </div>

    <!-- Advanced Filters Suite (Toggleable) -->
    <div x-show="showAdvanced" x-transition.opacity style="display: none;"
        class="flex flex-col gap-10 pt-8 border-t border-slate-100">

        <div class="bg-white/50 backdrop-blur-md rounded-[2rem] p-6 border border-slate-100/50">
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 pb-2">

                <!-- 1. Budget: Price Slider -->
                <div class="space-y-4">
                    <div class="flex justify-between items-center">
                        <label class="text-[10px] font-black uppercase text-slate-500 tracking-widest">Budget
                            Range</label>
                        <span class="text-[10px] font-black text-blue-600 bg-blue-50 px-2 py-1 rounded-lg">Up to ₹<span
                                x-text="maxPriceRange"></span></span>
                    </div>
                    <input type="range" name="max_price" min="2000" max="25000" step="500" x-model="maxPriceRange"
                        class="w-full h-1.5 bg-slate-100 rounded-lg appearance-none cursor-pointer accent-blue-600 hover:bg-slate-200 transition-colors">
                    <div class="flex justify-between text-[8px] font-black text-slate-400 uppercase tracking-tighter">
                        <span>₹2k</span>
                        <span>₹13.5k</span>
                        <span>₹25k</span>
                    </div>
                </div>

                <!-- 2. Identity: Gender Toggle -->
                <div class="space-y-4">
                    <label class="text-[10px] font-black uppercase text-slate-500 tracking-widest">Gender
                        Preference</label>
                    <div class="flex p-1 bg-slate-50 rounded-2xl border border-slate-100">
                        <input type="hidden" name="gender" x-model="genderFilter">
                        <button type="button" @click="genderFilter = 'BOYS'"
                            :class="genderFilter === 'BOYS' ? 'bg-white shadow-sm text-blue-600' : 'text-slate-400'"
                            class="flex-1 py-2 text-[9px] font-black uppercase rounded-xl transition-all">Boys</button>
                        <button type="button" @click="genderFilter = 'GIRLS'"
                            :class="genderFilter === 'GIRLS' ? 'bg-white shadow-sm text-pink-500' : 'text-slate-400'"
                            class="flex-1 py-2 text-[9px] font-black uppercase rounded-xl transition-all">Girls</button>
                        <button type="button" @click="genderFilter = 'COED'"
                            :class="genderFilter === 'COED' ? 'bg-white shadow-sm text-emerald-600' : 'text-slate-400'"
                            class="flex-1 py-2 text-[9px] font-black uppercase rounded-xl transition-all">Mixed</button>
                    </div>
                </div>

                <!-- 3. Type: Home Type Selection -->
                <div class="space-y-4">
                    <label class="text-[10px] font-black uppercase text-slate-500 tracking-widest">Home Type</label>
                    <div class="flex flex-col gap-3">
                        <div class="flex p-1 bg-slate-50 rounded-2xl border border-slate-100">
                            <button type="button" @click="homeType = 'PG'"
                                :class="homeType === 'PG' ? 'bg-white shadow-sm text-blue-600' : 'text-slate-400'"
                                class="flex-1 py-2.5 text-[10px] font-black uppercase rounded-xl transition-all">PG</button>
                            <button type="button" @click="homeType = 'FLAT'"
                                :class="homeType === 'FLAT' ? 'bg-white shadow-sm text-blue-600' : 'text-slate-400'"
                                class="flex-1 py-2.5 text-[10px] font-black uppercase rounded-xl transition-all">Flat</button>
                        </div>
                        <div class="relative transition-all duration-300"
                            :class="homeType !== 'FLAT' ? 'opacity-30 grayscale pointer-events-none' : 'opacity-100'">
                            <select name="bedrooms" x-model="bhkType" :disabled="homeType !== 'FLAT'"
                                class="w-full pl-5 pr-10 py-3 bg-white border border-slate-100 rounded-2xl text-[10px] font-black uppercase tracking-widest outline-none focus:ring-4 focus:ring-blue-100/50 transition-all appearance-none cursor-pointer shadow-sm">
                                <option value="">Any BHK</option>
                                <option value="0.5">1 RK</option>
                                <option value="1">1 BHK</option>
                                <option value="2">2 BHK</option>
                            </select>
                            <i
                                class="fas fa-chevron-down absolute right-5 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none text-[8px]"></i>
                            <div x-show="homeType !== 'FLAT'"
                                class="absolute inset-0 flex items-center justify-center pointer-events-none">
                                <i class="fas fa-lock text-[8px] text-slate-300"></i>
                            </div>
                        </div>
                        <input type="hidden" name="type" x-model="homeType">
                    </div>
                </div>

                <!-- 4. Privacy: Sharing Selection -->
                <div class="space-y-4">
                    <label class="text-[10px] font-black uppercase text-slate-500 tracking-widest">Sharing
                        (Privacy)</label>
                    <div class="flex flex-col gap-3">
                        <div class="flex p-1 bg-slate-50 rounded-2xl border border-slate-100">
                            <button type="button" @click="sharingLevel = ''"
                                :class="sharingLevel === '' ? 'bg-white shadow-sm text-slate-900' : 'text-slate-400'"
                                class="flex-1 py-2.5 text-[10px] font-black uppercase rounded-xl transition-all">Any</button>
                            <button type="button" @click="sharingLevel = '1'"
                                :class="sharingLevel === '1' ? 'bg-white shadow-sm text-slate-900' : 'text-slate-400'"
                                class="flex-1 py-2.5 text-[10px] font-black uppercase rounded-xl transition-all">Solo</button>
                            <button type="button" @click="if(!['2','3'].includes(sharingLevel)) sharingLevel = '2'"
                                :class="['2','3'].includes(sharingLevel) ? 'bg-white shadow-sm text-blue-600' : 'text-slate-400'"
                                class="flex-1 py-2.5 text-[10px] font-black uppercase rounded-xl transition-all">Shared</button>
                        </div>
                        <div class="relative transition-all duration-300"
                            :class="!['2','3'].includes(sharingLevel) ? 'opacity-30 grayscale pointer-events-none' : 'opacity-100'">
                            <select name="sharing_type" x-model="sharingLevel"
                                :disabled="!['2','3'].includes(sharingLevel)"
                                class="w-full pl-5 pr-10 py-3 bg-white border border-slate-100 rounded-2xl text-[10px] font-black uppercase tracking-widest outline-none focus:ring-4 focus:ring-blue-100/50 transition-all appearance-none cursor-pointer shadow-sm">
                                <option value="2">2 Person Sharing</option>
                                <option value="3">3 Person Sharing</option>
                            </select>
                            <i
                                class="fas fa-chevron-down absolute right-5 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none text-[8px]"></i>
                            <div x-show="!['2','3'].includes(sharingLevel)"
                                class="absolute inset-0 flex items-center justify-center pointer-events-none">
                                <i class="fas fa-lock text-[8px] text-slate-300"></i>
                            </div>
                        </div>
                        <input type="hidden" name="sharing_type" x-model="sharingLevel">
                    </div>
                </div>

                <!-- 5. Comfort & 6. Mess: Comfort Checkboxes -->
                <div class="space-y-4 lg:col-span-2">
                    <label class="text-[10px] font-black uppercase text-slate-500 tracking-widest">Premium
                        Features</label>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <!-- Premium Features Toggles -->
                        <div class="flex flex-col gap-3">
                            <!-- Row 1: AC and Food -->
                            <div class="flex p-1 bg-slate-50 rounded-2xl border border-slate-100 h-fit">
                                <button type="button" @click="acOnly = !acOnly"
                                    :class="acOnly ? 'bg-white shadow-sm text-orange-600' : 'text-slate-400'"
                                    class="flex-1 py-3 text-[9px] font-black uppercase rounded-xl transition-all">AC
                                    Only</button>
                                <button type="button" @click="mealsFilter = !mealsFilter"
                                    :class="mealsFilter ? 'bg-white shadow-sm text-emerald-600' : 'text-slate-400'"
                                    class="flex-1 py-3 text-[9px] font-black uppercase rounded-xl transition-all">Food
                                    Include</button>
                            </div>
                            <!-- Row 2: Wi-Fi and Laundry -->
                            <div class="flex p-1 bg-slate-50 rounded-2xl border border-slate-100 h-fit">
                                <button type="button" @click="wifiFilter = !wifiFilter"
                                    :class="wifiFilter ? 'bg-white shadow-sm text-blue-600' : 'text-slate-400'"
                                    class="flex-1 py-3 text-[9px] font-black uppercase rounded-xl transition-all">Wi-Fi</button>
                                <button type="button" @click="laundryFilter = !laundryFilter"
                                    :class="laundryFilter ? 'bg-white shadow-sm text-violet-600' : 'text-slate-400'"
                                    class="flex-1 py-3 text-[9px] font-black uppercase rounded-xl transition-all">Laundry</button>
                            </div>
                            <input type="checkbox" name="ac" x-model="acOnly" class="hidden">
                            <input type="checkbox" name="meals" x-model="mealsFilter" class="hidden">
                            <input type="checkbox" name="wifi" x-model="wifiFilter" class="hidden">
                            <input type="checkbox" name="laundry" x-model="laundryFilter" class="hidden">
                        </div>

                        <!-- Furnishing Options Toggle -->
                        <div class="flex flex-col gap-4">
                            <label class="text-[10px] font-black uppercase text-slate-500 tracking-widest">Furnishing
                                Status</label>
                            <div class="flex p-1 bg-slate-50 rounded-2xl border border-slate-100 h-fit">
                                <input type="hidden" name="furnishing" x-model="furnishFilter">
                                <button type="button" @click="furnishFilter = 'FULLY'"
                                    :class="furnishFilter === 'FULLY' ? 'bg-white shadow-sm text-indigo-600' : 'text-slate-400'"
                                    class="flex-1 py-3 text-[9px] font-black uppercase rounded-xl transition-all">Furnished</button>
                                <button type="button" @click="furnishFilter = 'SEMI'"
                                    :class="furnishFilter === 'SEMI' ? 'bg-white shadow-sm text-indigo-600' : 'text-slate-400'"
                                    class="flex-1 py-3 text-[9px] font-black uppercase rounded-xl transition-all">Semi</button>
                                <button type="button" @click="furnishFilter = 'UNFURNISHED'"
                                    :class="furnishFilter === 'UNFURNISHED' ? 'bg-white shadow-sm text-indigo-600' : 'text-slate-400'"
                                    class="flex-1 py-3 text-[9px] font-black uppercase rounded-xl transition-all">Unfurnished</button>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- AI Smart Match Logic Panel (Independent Layer) -->
    <div x-show="showSmartMatch" x-transition:enter="transition ease-out duration-500"
        x-transition:enter-start="opacity-0 -translate-y-10" x-transition:enter-end="opacity-100 translate-y-0"
        style="display: none;"
        class="mt-8 bg-slate-900/95 backdrop-blur-2xl p-8 rounded-[2.5rem] border border-slate-800 shadow-2xl relative overflow-hidden">
        <div class="absolute top-0 right-0 p-10 opacity-5 pointer-events-none">
            <i class="fas fa-wand-magic-sparkles text-8xl text-blue-400"></i>
        </div>

        <div class="relative z-10 flex flex-col gap-10">
            <div class="flex items-center justify-between">
                <div>
                    <h5 class="text-white font-black text-lg uppercase tracking-widest flex items-center gap-3">
                        <i class="fas fa-brain text-blue-400"></i> Smart Search Weights
                    </h5>
                    <p class="text-slate-400 text-[10px] font-bold mt-1 uppercase tracking-[0.2em]">Engineered proximity
                        scanning for your lifestyle</p>
                </div>
                <button type="button" @click="showSmartMatch = false"
                    class="text-slate-500 hover:text-white transition-colors">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-12">
                <div class="space-y-6">
                    <label
                        class="text-[10px] font-black uppercase tracking-[0.3em] text-blue-400 flex items-center justify-between">
                        Active Destinations
                        <span
                            class="bg-blue-500/10 text-blue-400 px-3 py-1 rounded-full text-[9px] font-black border border-blue-400/20"
                            x-text="favoredLocations.length + ' Markers'">0 Markers</span>
                    </label>

                    <!-- Location Adder -->
                    <div class="flex gap-3">
                        <select x-model="preset"
                            class="flex-1 px-5 py-4 bg-slate-800/50 rounded-2xl border border-slate-700 text-white font-bold outline-none text-xs shadow-inner">
                            <option value="">-- Quick Presets --</option>
                            <option value="23.0371,72.5445|Gujarat University">Gujarat University</option>
                            <option value="23.0238,72.5273|Shivranjani Cross Roads">Shivranjani Cross Roads</option>
                            <option value="23.0225,72.5714|Lal Darwaja">Lal Darwaja</option>
                            <option value="23.0497,72.5117|SG Highway">SG Highway</option>
                        </select>
                        <button type="button" @click="addPreset()"
                            class="w-14 h-14 bg-blue-600 text-white rounded-2xl hover:bg-blue-500 transition-all shadow-lg flex items-center justify-center">
                            <i class="fas fa-plus text-sm"></i>
                        </button>
                        <button type="button" @click="$dispatch('open-picker')"
                            class="w-14 h-14 bg-slate-800 text-white rounded-2xl hover:bg-slate-700 transition-all border border-slate-700 flex items-center justify-center">
                            <i class="fas fa-map-pin text-sm"></i>
                        </button>
                    </div>

                    <!-- Locations List Container -->
                    <div class="flex flex-col gap-3 max-h-[200px] overflow-y-auto pr-3 portal-scroll">
                        <template x-for="(loc, index) in favoredLocations" :key="index">
                            <div
                                class="flex items-center justify-between bg-white/5 px-5 py-4 rounded-2xl border border-white/5 shadow-sm">
                                <div class="flex items-center gap-4">
                                    <div
                                        class="w-2.5 h-2.5 rounded-full bg-blue-400 shadow-[0_0_10px_rgba(96,165,250,0.5)]">
                                    </div>
                                    <span class="text-xs font-black text-slate-200 uppercase tracking-tight"
                                        x-text="loc.label"></span>
                                </div>
                                <button type="button" @click="removeLocation(index)"
                                    class="text-slate-500 hover:text-red-400 transition-colors">
                                    <i class="fas fa-trash-alt text-xs"></i>
                                </button>
                            </div>
                        </template>
                        <div x-show="favoredLocations.length === 0"
                            class="text-[10px] font-bold text-slate-500 text-center py-8 bg-slate-800/20 rounded-2xl border border-dashed border-slate-700/50">
                            Pin your office, college, or gym to find the logical center
                        </div>
                    </div>
                </div>

                <div class="flex flex-col justify-between">
                    <div class="space-y-10">
                        <div class="space-y-4">
                            <div
                                class="flex justify-between items-center text-[10px] font-black uppercase tracking-[0.3em] text-slate-400">
                                <span>Travel Distance Priority</span>
                                <span x-text="distWeight + '%'"
                                    class="text-blue-400 bg-blue-400/10 px-3 py-1 rounded-full">33%</span>
                            </div>
                            <input type="range" min="0" max="100" x-model="distWeight"
                                class="w-full h-2 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-blue-500">
                        </div>
                        <div class="space-y-4">
                            <div
                                class="flex justify-between items-center text-[10px] font-black uppercase tracking-[0.3em] text-slate-400">
                                <span>Rent Affordability Weight</span>
                                <span x-text="costWeight + '%'"
                                    class="text-emerald-400 bg-emerald-400/10 px-3 py-1 rounded-full">33%</span>
                            </div>
                            <input type="range" min="0" max="100" x-model="costWeight"
                                class="w-full h-2 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-emerald-500">
                        </div>
                    </div>

                    <button type="button" @click="runSmartMatch(distWeight, costWeight, favoredLocations, $el)"
                        class="w-full mt-10 py-5 bg-gradient-to-r from-blue-600 to-indigo-600 text-white rounded-2xl font-black text-xs uppercase tracking-[0.3em] hover:scale-[1.02] active:scale-95 transition-all shadow-2xl shadow-blue-900/40">
                        ANALYZE BEST SCENARIOS <i class="fas fa-sparkles ml-3"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>
</form>
