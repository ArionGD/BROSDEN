{% extends base_template %}

{% block portal_content %}
<div
    class="h-[calc(100vh-180px)] w-full rounded-[2rem] overflow-hidden border-4 border-slate-300 shadow-xl relative bg-white">
    <!-- Map Container -->
    <div id="fullScreenMap" class="w-full h-full bg-slate-50" data-focus="{{ focus_id|default:'' }}"></div>

    <!-- Float Search Overlay -->
    <div class="absolute top-8 left-8 z-20 w-80">
        <div
            class="bg-white/40 backdrop-blur-2xl border border-white/40 p-1 rounded-[2.5rem] shadow-2xl overflow-hidden group">
            <div class="bg-white/80 backdrop-blur-md p-5 rounded-[2.2rem] border border-white/60">
                <h3
                    class="text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mb-4 flex items-center gap-2">
                    <i class="fas fa-compass text-blue-500 animate-pulse"></i> Navigation Hub
                </h3>
                <div class="relative">
                    <input type="text" id="mapSearch" placeholder="Search neighborhood..."
                        class="w-full pl-5 pr-12 py-4 bg-white/50 border border-slate-100 rounded-2xl text-sm font-bold focus:ring-4 focus:ring-blue-100/50 outline-none transition-all placeholder:text-slate-300">
                    <button onclick="searchMap()"
                        class="absolute right-2 top-2 w-10 h-10 bg-gradient-to-br from-blue-500 to-indigo-600 text-white rounded-xl shadow-lg shadow-blue-200 flex items-center justify-center hover:scale-105 active:scale-95 transition-transform">
                        <i class="fas fa-search text-xs"></i>
                    </button>
                </div>
            </div>
            <!-- Decorative Gradient Line -->
            <div class="h-1 w-full bg-gradient-to-r from-transparent via-blue-400/50 to-transparent"></div>
        </div>
    </div>
</div>

<!-- MapLibre Core -->
<link href='https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.css' rel='stylesheet' />
<script src='https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.js'></script>

<script type="application/json" id="map-data">
    [
        {% for property in properties %}
        {
            "id": {{ property.id }},
            "title": "{{ property.title|escapejs }}",
            "price": "{{ property.price }}",
            "lat": {{ property.latitude|default:0 }},
            "lng": {{ property.longitude|default:0 }},
            "city": "{{ property.city|escapejs }}",
            "url": "{% url 'property:detail' property.pk %}"
        }{% if not forloop.last %}, {% endif %}
        {% endfor %}
    ]
</script>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const properties = JSON.parse(document.getElementById('map-data').textContent);
        const mapEl = document.getElementById('fullScreenMap');
        const focusId = mapEl.getAttribute('data-focus');

        let center = [78.4867, 17.3850];
        let zoom = 12;

        if (focusId) {
            const focusProp = properties.find(p => p.id == focusId);
            if (focusProp) {
                center = [focusProp.lng, focusProp.lat];
                zoom = 16;
            }
        } else if (properties.length > 0) {
            center = [properties[0].lng, properties[0].lat];
        }

        const map = new maplibregl.Map({
            container: 'fullScreenMap',
            style: 'https://tiles.openfreemap.org/styles/liberty', // High-POI visibility style
            center: center,
            zoom: zoom,
            pitch: 0, // Flat 2D View
            bearing: 0,
            antialias: true
        });

        map.addControl(new maplibregl.NavigationControl({ showCompass: true }), 'bottom-right');

        properties.forEach(prop => {
            const el = document.createElement('div');
            el.className = 'map-marker';
            el.innerHTML = `
                <div class="group relative flex flex-col items-center">
                    <div class="bg-white/95 px-3 py-1.5 rounded-lg shadow-md border border-slate-200 mb-1 transform transition-all group-hover:-translate-y-1 max-w-[130px] truncate">
                        <span class="text-[10px] font-bold text-slate-800 tracking-tight">${prop.title}</span>
                    </div>
                    <div class="w-7 h-7 bg-blue-600 rounded-full flex items-center justify-center shadow-lg border-2 border-white relative z-10 transition-transform group-hover:scale-110">
                        <i class="fas fa-home text-white text-[10px]"></i>
                    </div>
                </div>
            `;

            const popup = new maplibregl.Popup({ offset: 25 })
                .setHTML(`
                    <div class="p-2">
                        <h4 class="font-black text-slate-800 mb-1">${prop.title}</h4>
                        <p class="text-[10px] text-slate-500 mb-3">${prop.city}</p>
                        <a href="${prop.url}" class="block text-center py-2 bg-blue-600 text-white rounded-lg text-xs font-bold no-underline">View Details</a>
                    </div>
                `);

            new maplibregl.Marker({ element: el })
                .setLngLat([prop.lng, prop.lat])
                .setPopup(popup)
                .addTo(map);
        });

        let searchMarker = null;

        window.searchMap = async function () {
            const query = document.getElementById('mapSearch').value;
            if (!query) return;
            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=1`);
                const data = await response.json();
                if (data && data.length > 0) {
                    const dest = [parseFloat(data[0].lon), parseFloat(data[0].lat)];

                    if (searchMarker) searchMarker.remove();

                    const el = document.createElement('div');
                    el.className = 'search-marker';
                    el.innerHTML = `<div class="w-10 h-10 bg-red-500 rounded-full border-4 border-white shadow-2xl flex items-center justify-center animate-bounce">
                        <i class="fas fa-location-dot text-white text-sm"></i>
                    </div>`;

                    searchMarker = new maplibregl.Marker({ element: el })
                        .setLngLat(dest)
                        .setPopup(new maplibregl.Popup({ offset: 25 }).setHTML(`
                            <div class="p-3">
                                <p class="text-[10px] font-black uppercase text-slate-400 mb-1">Search Result</p>
                                <p class="text-xs font-bold text-slate-800">${data[0].display_name}</p>
                            </div>
                        `))
                        .addTo(map);

                    map.flyTo({
                        center: dest,
                        zoom: 15,
                        pitch: 45,
                        essential: true
                    });

                    searchMarker.togglePopup();
                }
            } catch (e) { }
        };
    });
</script>

<style>
    .maplibregl-popup-content {
        border-radius: 20px !important;
        padding: 12px !important;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25) !important;
    }

    .map-marker {
        cursor: pointer;
    }

    .maplibregl-ctrl-logo,
    .maplibregl-ctrl-attrib {
        display: none !important;
    }
</style>
{% endblock %}
