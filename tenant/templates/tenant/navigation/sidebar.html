<aside id="sidebar"
    class="h-full bg-white border-r border-slate-200 flex flex-col shadow-xl z-20 transition-all duration-300 relative overflow-hidden group/sidebar"
    :class="sidebarCollapsed ? 'w-16' : 'w-72'">
    <div class="py-8 overflow-y-auto overflow-x-hidden flex-1 no-scrollbar flex flex-col">
        <!-- Sidebar Content Starts Directly -->
        <div class="mb-10 px-4"></div>

        <h2 x-show="!sidebarCollapsed" x-transition:enter="transition-opacity duration-200" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100"
            class="text-[10px] font-black uppercase tracking-widest text-slate-400 mb-6 px-5 transition-all duration-200 whitespace-nowrap overflow-hidden">
            Main Menu</h2>
        <nav class="space-y-3 flex-1">
            <a href="{% url 'analytics:tenant_dashboard' %}"
                class="flex items-center bg-blue-50 text-arion-blue rounded-2xl font-bold transition-all shadow-sm border-l-4 border-arion-blue"
                :class="sidebarCollapsed ? 'px-2 py-3 justify-center border-l-0' : 'px-5 py-3'">
                <i class="fas fa-chart-line w-6 text-center text-lg"></i> 
                <span x-show="!sidebarCollapsed" class="sidebar-text transition-all duration-200 ml-4 whitespace-nowrap overflow-hidden">Dashboard</span>
            </a>
            <a href="{% url 'map:explore' %}"
                class="flex items-center text-slate-500 hover:bg-slate-50 rounded-2xl font-bold transition-all border-l-4 border-transparent hover:border-slate-300"
                :class="sidebarCollapsed ? 'px-2 py-3 justify-center border-l-0' : 'px-5 py-3'">
                <i class="fas fa-map-location-dot w-6 text-center text-lg text-blue-500"></i> 
                <span x-show="!sidebarCollapsed" class="sidebar-text transition-all duration-200 ml-4 whitespace-nowrap overflow-hidden">Explore Map</span>
            </a>
            <a href="{% url 'booking:tenant_bookings' %}"
                class="flex items-center text-slate-500 hover:bg-slate-50 rounded-2xl font-bold transition-all border-l-4 border-transparent hover:border-slate-300"
                :class="sidebarCollapsed ? 'px-2 py-3 justify-center border-l-0' : 'px-5 py-3'">
                <i class="fas fa-calendar-check w-6 text-center text-lg text-emerald-500"></i> 
                <span x-show="!sidebarCollapsed" class="sidebar-text transition-all duration-200 ml-4 whitespace-nowrap overflow-hidden">Bookings</span>
            </a>
            <a href="{% url 'contract:rent_dashboard' %}"
                class="flex items-center text-slate-500 hover:bg-slate-50 rounded-2xl font-bold transition-all border-l-4 border-transparent hover:border-slate-300"
                :class="sidebarCollapsed ? 'px-2 py-3 justify-center border-l-0' : 'px-5 py-3'">
                <i class="fas fa-credit-card w-6 text-center text-lg text-indigo-500"></i> 
                <span x-show="!sidebarCollapsed" class="sidebar-text transition-all duration-200 ml-4 whitespace-nowrap overflow-hidden">Rent Management</span>
            </a>
            <a href="{% url 'chat:chat_list' %}"
                class="flex items-center text-slate-500 hover:bg-slate-50 rounded-2xl font-bold transition-all border-l-4 border-transparent hover:border-slate-300"
                :class="sidebarCollapsed ? 'px-2 py-3 justify-center border-l-0' : 'px-5 py-3'">
                <i class="fas fa-comments w-6 text-center text-lg text-arion-blue"></i> 
                <span x-show="!sidebarCollapsed" class="sidebar-text transition-all duration-200 ml-4 whitespace-nowrap overflow-hidden">Messages</span>
            </a>
            <a href="{% url 'accounts:tenant_kyc' %}"
                class="flex items-center text-slate-500 hover:bg-slate-50 rounded-2xl font-bold transition-all border-l-4 border-transparent hover:border-slate-300"
                :class="sidebarCollapsed ? 'px-2 py-3 justify-center border-l-0' : 'px-5 py-3'">
                <i class="fas fa-shield-halved w-6 text-center text-lg"></i> 
                <span x-show="!sidebarCollapsed" class="sidebar-text transition-all duration-200 ml-4 whitespace-nowrap overflow-hidden">KYC Verify</span>
            </a>
        </nav>
    </div>

    <div class="mt-auto px-2 py-4 border-t border-slate-100 overflow-hidden flex flex-col gap-4">
        <a href="{% url 'accounts:logout' %}"
            class="flex items-center text-red-500 hover:bg-red-50 rounded-2xl font-bold transition-all group/nav"
            :class="sidebarCollapsed ? 'px-2 py-3 justify-center border-l-0' : 'px-5 py-3 border-l-4 border-transparent hover:border-red-500'">
            <i class="fas fa-right-from-bracket w-6 text-center text-lg"></i> 
            <span x-show="!sidebarCollapsed" class="sidebar-text transition-all duration-200 ml-4 whitespace-nowrap overflow-hidden">Logout</span>
        </a>

        <!-- Toggle Button -->
        <button @click="sidebarCollapsed = !sidebarCollapsed"
            class="w-full h-12 bg-arion-orange hover:bg-arion-blue text-white rounded-2xl flex items-center justify-center shadow-lg shadow-orange-100 transition-all active:scale-95 group overflow-hidden">
            <i class="fas text-xs transition-transform duration-300"
               :class="sidebarCollapsed ? 'fa-chevron-right' : 'fa-chevron-left'"></i>
        </button>
    </div>
</aside>
