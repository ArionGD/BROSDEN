<aside id="sidebar"
    :class="{
        'w-20': sidebarCollapsed && !mobileMenuOpen,
        'w-72': !sidebarCollapsed || mobileMenuOpen,
        '-translate-x-full': !mobileMenuOpen,
        'translate-x-0': mobileMenuOpen
    }"
    class="fixed lg:static inset-y-0 left-0 h-full bg-white border-r border-slate-200 flex flex-col shadow-xl z-40 lg:z-20 transition-all duration-300 relative overflow-hidden group/sidebar lg:translate-x-0 lg:flex">
    <div class="py-8 overflow-hidden flex-1 flex flex-col px-3">
        <!-- Sidebar Content Starts Directly -->
        <div class="px-5 mb-5" x-show="!sidebarCollapsed" x-transition:enter="transition-opacity duration-200" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100">
            <h2 class="text-[10px] font-black uppercase tracking-widest text-slate-900/40 flex items-center gap-2">
                <span class="w-1.5 h-1.5 rounded-full bg-blue-500"></span>
                Menu
            </h2>
        </div>
        <nav class="space-y-2 flex-1">
            <a href="{% url 'analytics:tenant_dashboard' %}"
                class="flex items-center rounded-2xl font-bold transition-all {% if request.resolver_match.view_name == 'analytics:tenant_dashboard' or request.resolver_match.view_name == 'tenant:dashboard' %}bg-blue-50 text-arion-blue shadow-sm border-l-4 border-arion-blue{% else %}text-slate-900 hover:bg-slate-50 border-l-4 border-transparent hover:border-slate-300{% endif %}"
                :class="sidebarCollapsed ? 'px-2 py-3 justify-center border-l-0' : 'px-4 py-3'">
                <i class="fas fa-chart-line w-6 text-center text-lg text-blue-500"></i> 
                <span x-show="!sidebarCollapsed" class="sidebar-text text-[14px] transition-all duration-200 ml-4 whitespace-nowrap overflow-hidden font-bold">Dashboard</span>
            </a>
            <a href="{% url 'map:explore' %}"
                class="flex items-center rounded-2xl font-bold transition-all {% if request.resolver_match.view_name == 'map:explore' %}bg-blue-50 text-arion-blue shadow-sm border-l-4 border-arion-blue{% else %}text-slate-900 hover:bg-slate-50 border-l-4 border-transparent hover:border-slate-300{% endif %}"
                :class="sidebarCollapsed ? 'px-2 py-3 justify-center border-l-0' : 'px-4 py-3'">
                <i class="fas fa-map-location-dot w-6 text-center text-lg text-blue-500"></i> 
                <span x-show="!sidebarCollapsed" class="sidebar-text text-[14px] transition-all duration-200 ml-4 whitespace-nowrap overflow-hidden font-bold">Explore</span>
            </a>
            <a href="{% url 'booking:tenant_bookings' %}"
                class="flex items-center rounded-2xl font-bold transition-all {% if request.resolver_match.view_name == 'booking:tenant_bookings' %}bg-blue-50 text-arion-blue shadow-sm border-l-4 border-arion-blue{% else %}text-slate-900 hover:bg-slate-50 border-l-4 border-transparent hover:border-slate-300{% endif %}"
                :class="sidebarCollapsed ? 'px-2 py-3 justify-center border-l-0' : 'px-4 py-3'">
                <i class="fas fa-calendar-days w-6 text-center text-lg text-blue-500"></i> 
                <span x-show="!sidebarCollapsed" class="sidebar-text text-[14px] transition-all duration-200 ml-4 whitespace-nowrap overflow-hidden font-bold">Bookings</span>
            </a>
            <a href="{% url 'contract:rent_dashboard' %}"
                class="flex items-center rounded-2xl font-bold transition-all {% if request.resolver_match.view_name == 'contract:rent_dashboard' %}bg-blue-50 text-arion-blue shadow-sm border-l-4 border-arion-blue{% else %}text-slate-900 hover:bg-slate-50 border-l-4 border-transparent hover:border-slate-300{% endif %}"
                :class="sidebarCollapsed ? 'px-2 py-3 justify-center border-l-0' : 'px-4 py-3'">
                <i class="fas fa-credit-card w-6 text-center text-lg text-blue-500"></i> 
                <span x-show="!sidebarCollapsed" class="sidebar-text text-[14px] transition-all duration-200 ml-4 whitespace-nowrap overflow-hidden font-bold">Payments</span>
            </a>
            <a href="{% url 'chat:chat_list' %}"
                class="flex items-center rounded-2xl font-bold transition-all {% if 'chat' in request.resolver_match.view_name %}bg-blue-50 text-arion-blue shadow-sm border-l-4 border-arion-blue{% else %}text-slate-900 hover:bg-slate-50 border-l-4 border-transparent hover:border-slate-300{% endif %}"
                :class="sidebarCollapsed ? 'px-2 py-3 justify-center border-l-0' : 'px-4 py-3'">
                <i class="fas fa-comments w-6 text-center text-lg text-arion-blue"></i> 
                <span x-show="!sidebarCollapsed" class="sidebar-text text-[14px] transition-all duration-200 ml-4 whitespace-nowrap overflow-hidden font-bold">Messages</span>
            </a>

        </nav>
    </div>

    <div class="mt-auto px-3 py-6 border-t border-slate-50 overflow-hidden flex flex-col gap-2">
        <div class="px-5 mb-2" x-show="!sidebarCollapsed" x-transition:enter="transition-opacity duration-200" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100">
            <h2 class="text-[10px] font-black uppercase tracking-widest text-slate-900/40">
                Account
            </h2>
        </div>
        
        <a href="{% url 'accounts:account_settings' %}"
            class="flex items-center rounded-2xl font-bold transition-all group/nav {% if request.resolver_match.view_name == 'accounts:account_settings' %}bg-blue-50 text-arion-blue shadow-sm border-l-4 border-arion-blue{% else %}text-slate-900 hover:bg-slate-50 border-l-4 border-transparent hover:border-slate-300{% endif %}"
            :class="sidebarCollapsed ? 'px-2 py-3 justify-center border-l-0' : 'px-4 py-3'">
            <i class="fas fa-gear w-6 text-center text-lg text-blue-500 group-hover/nav:rotate-90 transition-transform duration-500"></i> 
            <span x-show="!sidebarCollapsed" class="sidebar-text text-[14px] transition-all duration-200 ml-4 whitespace-nowrap overflow-hidden font-bold">Settings</span>
        </a>

        <a href="{% url 'accounts:logout' %}"
            class="flex items-center text-red-500 hover:bg-red-50 rounded-2xl font-bold transition-all group/nav"
            :class="sidebarCollapsed ? 'px-2 py-3 justify-center border-l-0' : 'px-4 py-3 border-l-4 border-transparent hover:border-red-500'">
            <i class="fas fa-right-from-bracket w-6 text-center text-lg transition-transform duration-300 group-hover/nav:-translate-x-1.5"></i> 
            <span x-show="!sidebarCollapsed" class="sidebar-text text-[14px] transition-all duration-200 ml-4 whitespace-nowrap overflow-hidden font-bold">Logout</span>
        </a>

        <!-- Toggle Button -->
        <div class="pt-2">
            <button @click="sidebarCollapsed = !sidebarCollapsed"
                class="w-full h-11 bg-slate-900 hover:bg-arion-blue text-white rounded-2xl flex items-center justify-center shadow-lg shadow-slate-200 transition-all active:scale-95 group overflow-hidden">
                <i class="fas text-xs transition-transform duration-300"
                   :class="sidebarCollapsed ? 'fa-chevron-right' : 'fa-chevron-left'"></i>
            </button>
        </div>
    </div>
</aside>
