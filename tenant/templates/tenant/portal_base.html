{% extends "base.html" %}

{% block title %}Tenant Portal - BrosDen-AV{% endblock %}

{% block content %}
<div class="flex h-[calc(100vh-80px)] overflow-hidden bg-white">
    <!-- Sidebar Navigation -->
    {% include "tenant/navigation/sidebar.html" %}

    <!-- Main Area - Fixed Header + Scrollable Content -->
    <div class="flex-1 flex flex-col h-full overflow-hidden">
        <!-- Portal Header Navigation -->
        {% include "tenant/navigation/header.html" %}

        <!-- Dynamic Content Area - Scrollable -->
        <main class="flex-1 overflow-y-auto p-10 bg-white overscroll-none">
            <div class="max-w-6xl mx-auto">
                {% block portal_content %}{% endblock %}
            </div>
        </main>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const sidebar = document.getElementById('sidebar');
        const toggleBtn = document.getElementById('sidebarToggle');
        const toggleIcon = document.getElementById('toggleIcon');
        const sidebarTexts = document.querySelectorAll('.sidebar-text');
        const sidebarTitle = document.getElementById('sidebarTitle');

        if (toggleBtn && sidebar) {
            toggleBtn.addEventListener('click', function () {
                if (sidebar.classList.contains('w-72')) {
                    // Collapse
                    sidebar.classList.remove('w-72');
                    sidebar.classList.add('w-20');
                    toggleIcon.classList.remove('fa-chevron-left');
                    toggleIcon.classList.add('fa-chevron-right');
                    sidebarTexts.forEach(t => t.classList.add('opacity-0', 'hidden'));
                    if (sidebarTitle) sidebarTitle.classList.add('opacity-0');
                } else {
                    // Expand
                    sidebar.classList.remove('w-20');
                    sidebar.classList.add('w-72');
                    toggleIcon.classList.remove('fa-chevron-right');
                    toggleIcon.classList.add('fa-chevron-left');
                    sidebarTexts.forEach(t => t.classList.remove('opacity-0', 'hidden'));
                    if (sidebarTitle) sidebarTitle.classList.remove('opacity-0');
                }
            });
        }
    });
</script>
{% endblock %}

{% block footer %}{% endblock %}
