{% extends portal_base %}

{% block title %}Review {{ booking.property.title }} | BrosDen-AV{% endblock %}

{% block portal_content %}
<div class="max-w-3xl mx-auto py-10">
    <div class="mb-10 flex items-center justify-between">
        <div>
            <h1 class="text-4xl font-black text-slate-900 tracking-tight">Write a Review</h1>
            <p class="text-slate-500 font-medium mt-1">Share your experience living at {{ booking.property.title }}.</p>
        </div>
        <a href="{% url 'booking:tenant_bookings' %}"
            class="w-12 h-12 bg-slate-100 rounded-2xl flex items-center justify-center text-slate-400 hover:bg-slate-200 transition-all no-underline">
            <i class="fas fa-times"></i>
        </a>
    </div>

    <form method="POST" x-data="{ rating: {{ form.rating.value|default:0 }}, hoverRating: 0 }" class="bg-white rounded-[3rem] p-10 md:p-16 shadow-2xl border border-slate-100 space-y-10">
        {% csrf_token %}

        <!-- Rating Selection -->
        <div class="text-center">
            <label class="text-[10px] font-black uppercase tracking-widest text-slate-400 mb-6 block">Overall Rating</label>
            <div class="flex items-center justify-center gap-4">
                <template x-for="i in 5">
                    <button type="button" 
                        @click="rating = i; $refs.ratingInput.value = i"
                        @mouseenter="hoverRating = i"
                        @mouseleave="hoverRating = 0"
                        :class="{'text-amber-400': i <= (hoverRating || rating), 'text-slate-200': i > (hoverRating || rating)}"
                        class="text-4xl transition-colors hover:scale-110 transform duration-200 active:scale-95">
                        <i class="fas fa-star"></i>
                    </button>
                </template>
            </div>
            <input type="hidden" name="rating" x-ref="ratingInput" :value="rating" id="id_rating" required>
        </div>

        <!-- Comment -->
        <div class="space-y-3">
            <label class="text-[10px] font-black uppercase tracking-widest text-slate-400 ml-4">Detailed Review</label>
            {{ form.comment }}
        </div>

        <button type="submit"
            class="w-full bg-slate-900 text-white py-6 rounded-[2rem] font-black text-sm hover:bg-black shadow-2xl shadow-slate-200 transition-all flex items-center justify-center gap-2 group">
            Submit Review <i class="fas fa-paper-plane text-arion-orange group-hover:translate-x-1 group-hover:-translate-y-1 transition-transform"></i>
        </button>
    </form>
</div>
{% endblock %}
