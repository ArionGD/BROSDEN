<header class="bg-white border-b border-slate-200 py-3 px-8 flex items-center justify-between shadow-sm z-10">
    <div class="flex items-center gap-6">
        <a href="{% url 'index' %}" class="flex items-center no-underline group gap-2">
            <div
                class="flex items-center justify-center w-10 h-10 bg-arion-blue rounded-xl text-white shadow-lg shadow-blue-100 transform group-hover:rotate-6 transition-transform">
                <i class="fas fa-home text-xs"></i>
            </div>
            <div class="flex items-baseline">
                <span class="text-2xl font-black tracking-tighter text-slate-900">den</span>
                <span class="w-1.5 h-1.5 bg-arion-orange rounded-full ml-1"></span>
            </div>
        </a>
        <div class="h-10 w-px bg-slate-200"></div>
        <div>
            <h1 class="text-lg font-black text-slate-900 tracking-tight">Owner Workspace</h1>
            <p class="text-slate-500 font-bold mt-0.5 text-[9px] uppercase tracking-widest opacity-60">Business Suite</p>
        </div>
    </div>
    <div class="flex items-center gap-6">
        <a href="{% url 'property:add_property' %}"
            class="hidden lg:flex items-center bg-arion-blue hover:opacity-90 text-white px-5 py-2.5 rounded-xl font-bold transition-all shadow-lg shadow-blue-200 text-xs">
            <i class="fas fa-plus mr-2"></i> Add New Property
        </a>
        <div class="h-10 w-px bg-slate-200"></div>

        {% load badge_tags %}
        {% owner_badge user as badge %}
        <div class="flex items-center gap-3">
            <div class="text-right hidden sm:block">
                <p class="text-sm font-bold text-slate-900">{{ user.username }}</p>
                <p
                    class="text-[10px] font-black uppercase tracking-widest {% if badge.color == 'cyan' %}text-cyan-500{% elif badge.color == 'amber' %}text-amber-500{% elif badge.color == 'slate' %}text-slate-500{% elif badge.color == 'orange' %}text-orange-500{% elif badge.color == 'red' %}text-red-500{% else %}text-slate-400{% endif %}">
                    <i class="{{ badge.icon }} mr-1"></i> {{ badge.name }} Partner
                </p>
            </div>
            <div
                class="w-10 h-10 rounded-xl flex items-center justify-center shadow-inner text-white {% if badge.color == 'cyan' %}bg-cyan-500{% elif badge.color == 'amber' %}bg-amber-500{% elif badge.color == 'slate' %}bg-slate-500{% elif badge.color == 'orange' %}bg-orange-500{% elif badge.color == 'red' %}bg-red-500{% else %}bg-slate-200 text-slate-400{% endif %}">
                <i class="{{ badge.icon }} text-base"></i>
            </div>
        </div>
    </div>
</header>
