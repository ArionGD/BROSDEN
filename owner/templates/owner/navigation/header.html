<header class="bg-white border-b border-slate-200 p-8 flex items-center justify-between shadow-sm z-10">
    <div>
        <h1 class="text-3xl font-black text-slate-900 tracking-tight">Owner Workspace</h1>
        <p class="text-slate-500 font-medium mt-1 text-sm">Control your real estate business efficiently.</p>
    </div>
    <div class="flex items-center gap-6">
        <a href="{% url 'property:add_property' %}"
            class="hidden lg:flex items-center bg-arion-blue hover:opacity-90 text-white px-6 py-3 rounded-xl font-bold transition-all shadow-lg shadow-blue-200 text-sm">
            <i class="fas fa-plus mr-2"></i> Add New Property
        </a>
        <div class="h-10 w-px bg-slate-200"></div>

        {% load badge_tags %}
        {% owner_badge user as badge %}
        <div class="flex items-center gap-3">
            <div class="text-right hidden sm:block">
                <p class="text-sm font-bold text-slate-900">{{ user.username }}</p>
                <p
                    class="text-[10px] font-black uppercase tracking-widest {% if badge.color == 'cyan' %}text-cyan-500{% elif badge.color == 'amber' %}text-amber-500{% elif badge.color == 'slate' %}text-slate-500{% elif badge.color == 'orange' %}text-orange-500{% elif badge.color == 'red' %}text-red-500{% else %}text-slate-400{% endif %}">
                    <i class="{{ badge.icon }} mr-1"></i> {{ badge.name }} Partner
                </p>
            </div>
            <div
                class="w-12 h-12 rounded-2xl flex items-center justify-center shadow-inner text-white {% if badge.color == 'cyan' %}bg-cyan-500{% elif badge.color == 'amber' %}bg-amber-500{% elif badge.color == 'slate' %}bg-slate-500{% elif badge.color == 'orange' %}bg-orange-500{% elif badge.color == 'red' %}bg-red-500{% else %}bg-slate-200 text-slate-400{% endif %}">
                <i class="{{ badge.icon }} text-xl"></i>
            </div>
        </div>
    </div>
</header>
