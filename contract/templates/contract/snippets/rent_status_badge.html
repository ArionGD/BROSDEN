{% if item.status == 'PAID' %}
<span class="inline-flex items-center px-3 py-1 rounded-full bg-green-100 text-green-600 text-[10px] font-black uppercase tracking-tighter shadow-sm">
    <i class="fas fa-check-circle mr-1"></i> {% if role == 'owner' %}Collected{% else %}Paid{% endif %}
</span>
{% elif item.status == 'OVERDUE' %}
<span class="inline-flex items-center px-3 py-1 rounded-full bg-red-100 text-red-600 text-[10px] font-black uppercase tracking-tighter shadow-sm">
    <i class="fas fa-exclamation-circle mr-1"></i> Overdue
</span>
{% else %}
<span class="inline-flex items-center px-3 py-1 rounded-full bg-amber-100 text-amber-600 text-[10px] font-black uppercase tracking-tighter shadow-sm">
    <i class="fas fa-clock mr-1"></i> {% if role == 'owner' %}Pending{% else %}Unpaid{% endif %}
</span>
{% endif %}
