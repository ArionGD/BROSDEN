{% extends "tenant/portal_base.html" %}

{% block content %}
<div class="max-w-3xl mx-auto py-12 px-4 sm:px-6 lg:px-8">
    <div class="bg-gray-800/60 backdrop-blur-2xl border border-gray-700 rounded-3xl shadow-2xl overflow-hidden p-8">

        <h2 class="text-2xl font-bold tracking-tight text-white mb-2">Monthly Feedback Request</h2>
        <p class="text-sm text-gray-400 mb-6">How was your past month at {{
            feedback_request.contract.booking.property.title }}? Your continuous feedback helps maintain quality
            standards.</p>

        <form method="post" class="space-y-6">
            {% csrf_token %}

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Maintenance -->
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Maintenance Quality (1-5)</label>
                    <input type="range" name="maintenance_rating" min="1" max="5" value="5"
                        class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer"
                        oninput="this.nextElementSibling.value = this.value">
                    <output class="mt-1 text-sm text-indigo-400 font-bold block text-center">5</output>
                </div>
                <!-- Responsiveness -->
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Owner Responsiveness (1-5)</label>
                    <input type="range" name="responsiveness_rating" min="1" max="5" value="5"
                        class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer"
                        oninput="this.nextElementSibling.value = this.value">
                    <output class="mt-1 text-sm text-indigo-400 font-bold block text-center">5</output>
                </div>
                <!-- Safety -->
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Safety & Security (1-5)</label>
                    <input type="range" name="safety_rating" min="1" max="5" value="5"
                        class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer"
                        oninput="this.nextElementSibling.value = this.value">
                    <output class="mt-1 text-sm text-indigo-400 font-bold block text-center">5</output>
                </div>
                <!-- Vibe -->
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Neighborhood/Hostel Vibe (1-5)</label>
                    <input type="range" name="vibe_rating" min="1" max="5" value="5"
                        class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer"
                        oninput="this.nextElementSibling.value = this.value">
                    <output class="mt-1 text-sm text-indigo-400 font-bold block text-center">5</output>
                </div>
            </div>

            <div class="pt-4">
                <label for="comments" class="block text-sm font-medium text-gray-300 mb-2">Any specific comments for
                    this month? (Optional)</label>
                <textarea name="comments" id="comments" rows="4"
                    class="block w-full bg-gray-900 border border-gray-700 rounded-xl shadow-sm py-3 px-4 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm text-white transition-colors"></textarea>
            </div>

            <div class="pt-6 border-t border-gray-700 flex justify-end">
                <button type="submit"
                    class="inline-flex items-center px-6 py-3 border border-transparent text-base font-medium rounded-xl shadow-sm text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-all hover:-translate-y-0.5">
                    Submit Monthly Feedback
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
