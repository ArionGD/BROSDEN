<script>
    let favoredLocations = [];
    let pickerMap = null;
    let pickerMarker = null;
    let selectedLatLng = null;

    function renderLocations() {
        const list = document.getElementById('target-locations-list');
        const hint = document.getElementById('no-locations-hint');
        const count = document.getElementById('location-count');
        if (!list) return;

        list.innerHTML = '';
        if (favoredLocations.length === 0) {
            if(hint) hint.classList.remove('hidden');
            if(hint) list.appendChild(hint);
            if(count) count.innerText = "0 Added";
        } else {
            if(hint) hint.classList.add('hidden');
            if(count) count.innerText = `${favoredLocations.length} Added`;
            favoredLocations.forEach((loc, index) => {
                const item = document.createElement('div');
                item.className = 'flex items-center justify-between bg-white px-4 py-3 rounded-xl border border-slate-100 shadow-sm animate-in slide-in-from-right-2 duration-300';
                item.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="w-2 h-2 rounded-full bg-blue-500"></div>
                        <span class="text-[10px] font-black text-slate-800 uppercase tracking-tight">${loc.label}</span>
                    </div>
                    <button type="button" onclick="removeLocation(${index})" class="text-slate-300 hover:text-red-500 transition-colors">
                        <i class="fas fa-trash-alt text-[10px]"></i>
                    </button>
                `;
                list.appendChild(item);
            });
        }
    }

    function addLocation(lat, lng, label) {
        favoredLocations.push({ lat, lng, label });
        renderLocations();
    }

    function removeLocation(index) {
        favoredLocations.splice(index, 1);
        renderLocations();
    }

    function addLocationFromPreset() {
        const select = document.getElementById('target-preset');
        if (!select || !select.value) return;
        
        const option = select.options[select.selectedIndex];
        const label = option.getAttribute('data-label');
        const [lat, lng] = select.value.split(',').map(Number);
        
        addLocation(lat, lng, label);
        select.value = ''; // Reset select
    }

    // Map Picker Logic
    function openMapPicker() {
        const modal = document.getElementById('map-picker-modal');
        const content = document.getElementById('map-modal-content');
        if(!modal || !content) return;
        
        modal.classList.remove('hidden');
        
        // Animation
        setTimeout(() => {
            content.classList.remove('scale-95', 'opacity-0');
            content.classList.add('scale-100', 'opacity-100');
        }, 10);

        if (!pickerMap) {
            // Initialize map (default to center of India if no geolocation)
            pickerMap = L.map('picker-map').setView([23.0225, 72.5714], 12);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; OpenStreetMap contributors & CARTO'
            }).addTo(pickerMap);

            pickerMap.on('click', function(e) {
                if (pickerMarker) pickerMap.removeLayer(pickerMarker);
                pickerMarker = L.marker(e.latlng).addTo(pickerMap);
                selectedLatLng = e.latlng;
            });
        } else {
            pickerMap.invalidateSize();
        }
    }

    function closeMapPicker() {
        const modal = document.getElementById('map-picker-modal');
        const content = document.getElementById('map-modal-content');
        if(!modal || !content) return;

        content.classList.remove('scale-100', 'opacity-100');
        content.classList.add('scale-95', 'opacity-0');
        setTimeout(() => {
            modal.classList.add('hidden');
        }, 300);
    }

    function confirmMapLocation() {
        if (!selectedLatLng) return alert("Please select a location first.");
        const label = prompt("Enter a label (e.g., Office, College):", "Custom Point");
        if(label) {
            addLocation(selectedLatLng.lat, selectedLatLng.lng, label);
            closeMapPicker();
        }
    }

    function toggleSmartMatch() {
        const panel = document.getElementById('smart-match-panel');
        if(panel) panel.classList.toggle('hidden');
    }

    function toggleAdvancedFilters() {
        const panel = document.getElementById('advanced-filters-panel');
        if(panel) panel.classList.toggle('hidden');
        
        // Rotate icon
        const icon = document.getElementById('adv-filter-icon');
        if(icon) icon.classList.toggle('rotate-180');
    }

    function updateWeightLabels() {
        const dist = document.getElementById('w-dist');
        const cost = document.getElementById('w-cost');
        if(dist) document.getElementById('w-dist-val').innerText = dist.value + '%';
        if(cost) document.getElementById('w-cost-val').innerText = cost.value + '%';
    }

    async function runSmartMatch() {
        if (favoredLocations.length === 0) return alert("Please add at least one favored location!");

        const btn = document.getElementById('run-match-btn');
        if(!btn) return;

        const originalText = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-circle-notch fa-spin relative"></i> ANALYZING CENTER...';

        // Calculate Centroid
        const avgLat = favoredLocations.reduce((sum, loc) => sum + loc.lat, 0) / favoredLocations.length;
        const avgLng = favoredLocations.reduce((sum, loc) => sum + loc.lng, 0) / favoredLocations.length;

        const w_dist = document.getElementById('w-dist')?.value || 33;
        const w_price = document.getElementById('w-cost')?.value || 33;
        const w_rating = 100 - (parseInt(w_dist) + parseInt(w_price));

        try {
            const response = await fetch(`/map/smart-api/?lat=${avgLat}&lng=${avgLng}&w_dist=${w_dist}&w_price=${w_price}&w_rating=${w_rating}`);
            const data = await response.json();
            
            if (data.results) {
                reorderProperties(data.results);
            }
        } catch (error) {
            console.error('Smart Match failed:', error);
        } finally {
            btn.disabled = false;
            btn.innerHTML = originalText;
        }
    }

    function reorderProperties(results) {
        const grid = document.querySelector('.main-property-grid');
        if(!grid) return;
        const cards = Array.from(grid.children);
        
        const scoreMap = {};
        results.forEach(r => scoreMap[r.id] = r);

        cards.sort((a, b) => {
            const aLink = a.querySelector('a[href*="/property/"]');
            const bLink = b.querySelector('a[href*="/property/"]');
            if (!aLink || !bLink) return 0;

            const aId = aLink.getAttribute('href').split('/').filter(Boolean).pop();
            const bId = bLink.getAttribute('href').split('/').filter(Boolean).pop();
            
            const aData = scoreMap[aId];
            const bData = scoreMap[bId];

            if (!aData) return 1;
            if (!bData) return -1;
            return bData.score - aData.score;
        });

        grid.innerHTML = '';
        cards.forEach(card => {
            const link = card.querySelector('a[href*="/property/"]');
            if(!link) { grid.appendChild(card); return; }

            const id = link.getAttribute('href').split('/').filter(Boolean).pop();
            const data = scoreMap[id];
            
            let scoreBadge = card.querySelector('.smart-score-badge');
            if (!scoreBadge) {
                const container = card.querySelector('.image-container');
                if(container) {
                    scoreBadge = document.createElement('div');
                    scoreBadge.className = 'smart-score-badge absolute top-4 left-1/2 -translate-x-1/2 bg-blue-600/90 text-white px-3 py-1.5 rounded-full text-xs font-black shadow-xl border-2 border-white/20 backdrop-blur-md animate-toast-in z-20 flex items-center gap-1.5';
                    container.appendChild(scoreBadge);
                }
            }
            
            if (data && scoreBadge) {
                scoreBadge.innerHTML = `<i class="fas fa-star text-yellow-300"></i> ${data.score}% Match <span class="bg-black/20 px-1.5 py-0.5 rounded text-[9px] ml-1">${data.dist_km}km</span>`;
                scoreBadge.classList.remove('hidden');
            } else if(scoreBadge) {
                scoreBadge.classList.add('hidden');
            }

            grid.appendChild(card);
        });
    }
</script>
