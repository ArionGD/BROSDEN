<!-- PG Fields -->
<div id="pg-fields" class="grid grid-cols-1 md:grid-cols-2 gap-8 hidden">
    <div class="space-y-2">
        <label class="text-xs font-black uppercase tracking-widest text-slate-400 px-1">Sharing Type</label>
        {{ form.sharing_type }}
    </div>
    <div class="space-y-2">
        <label class="text-xs font-black uppercase tracking-widest text-slate-400 px-1">Gender Preference</label>
        {{ form.gender_preference }}
    </div>
    <div class="space-y-2">
        <label class="text-xs font-black uppercase tracking-widest text-slate-400 px-1">Total Capacity</label>
        {{ form.total_capacity }}
    </div>
    <div class="space-y-2">
        <label class="text-xs font-black uppercase tracking-widest text-slate-400 px-1">Cleaning Frequency</label>
        {{ form.cleaning_frequency }}
    </div>
    <div class="md:col-span-2 grid grid-cols-2 md:grid-cols-4 gap-4">
        <label class="flex items-center gap-3 p-4 bg-slate-50 border border-slate-200 rounded-xl cursor-pointer hover:bg-slate-100 transition-all">
            {{ form.food_included }}
            <span class="text-sm font-bold text-slate-700">Food Inc.</span>
        </label>
        <label class="flex items-center gap-3 p-4 bg-slate-50 border border-slate-200 rounded-xl cursor-pointer hover:bg-slate-100 transition-all">
            {{ form.ac_available }}
            <span class="text-sm font-bold text-slate-700">AC</span>
        </label>
        <label class="flex items-center gap-3 p-4 bg-slate-50 border border-slate-200 rounded-xl cursor-pointer hover:bg-slate-100 transition-all">
            {{ form.wifi_available }}
            <span class="text-sm font-bold text-slate-700">WiFi</span>
        </label>
        <label class="flex items-center gap-3 p-4 bg-slate-50 border border-slate-200 rounded-xl cursor-pointer hover:bg-slate-100 transition-all">
            {{ form.laundry_available }}
            <span class="text-sm font-bold text-slate-700">Laundry</span>
        </label>
    </div>
    <div class="md:col-span-2 space-y-2">
        <label class="text-xs font-black uppercase tracking-widest text-slate-400 px-1">Food Details</label>
        {{ form.food_details }}
    </div>
    <div class="md:col-span-2 space-y-2">
        <label class="text-xs font-black uppercase tracking-widest text-slate-400 px-1">Rules & Restrictions</label>
        {{ form.rules_restrictions }}
    </div>
</div>
