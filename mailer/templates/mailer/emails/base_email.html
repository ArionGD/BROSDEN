<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block subject %}BrosDen-AV{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        arion: {
                            blue: '#1A73E8',
                            dark: '#0e3fa3',
                            orange: '#E75A27',
                            gold: '#fbbf24'
                        }
                    }
                }
            }
        }
    </script>
    <style type="text/css">
        /* Email-specific resets and fallbacks */
        body {
            width: 100% !important;
            -webkit-text-size-adjust: 100%;
            -ms-text-size-adjust: 100%;
            margin: 0;
            padding: 0;
        }

        img {
            outline: none;
            text-decoration: none;
            -ms-interpolation-mode: bicubic;
            border: none;
        }

        .wrapper {
            width: 100%;
            max-width: 620px;
            margin: 0 auto;
        }
    </style>
</head>

<body class="bg-slate-100 font-sans text-slate-800 m-0 p-0">
    <div
        class="wrapper max-w-[620px] mx-auto my-10 bg-white rounded-[20px] overflow-hidden shadow-xl border border-slate-200">

        <!-- Header -->
        <div class="bg-gradient-to-br from-arion-blue to-arion-dark p-9 text-center">
            <div class="text-[26px] font-black text-white tracking-tight">
                Bros<span class="text-arion-gold">Den</span>-AV
            </div>
            <div class="text-white/70 text-xs mt-1 font-medium tracking-wider uppercase">
                Smart Property Management Platform
            </div>
        </div>

        <!-- Content -->
        <div class="email-content">
            {% block email_content %}{% endblock %}
        </div>

        <!-- Footer -->
        <div class="bg-slate-50 border-t border-slate-200 p-10 text-center">
            <p class="text-xs text-slate-400 leading-relaxed">
                This is an automated message from <strong class="text-slate-600">BrosDen-AV</strong>.<br>
                Please do not reply directly to this email.<br>
                For support, <a href="mailto:aditya.raj322005@gmail.com"
                    class="text-arion-blue font-semibold no-underline">contact us here</a>.
            </p>
            <p class="text-xs text-slate-300 mt-4 tracking-tight">© 2025 BrosDen-AV. All rights reserved.</p>
        </div>

    </div>
</body>

</html>
