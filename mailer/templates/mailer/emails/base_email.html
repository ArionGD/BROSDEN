<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block subject %}BrosDen-AV{% endblock %}</title>
    <style>
        /* Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f1f5f9;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            color: #1e293b;
        }

        /* Wrapper */
        .wrapper {
            max-width: 620px;
            margin: 40px auto;
            background: #ffffff;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
        }

        /* Header */
        .email-header {
            background: linear-gradient(135deg, #1a56db 0%, #0e3fa3 100%);
            padding: 36px 40px;
            text-align: center;
        }

        .email-header .logo {
            font-size: 26px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: -0.5px;
        }

        .email-header .logo span {
            color: #fbbf24;
        }

        .email-header .tagline {
            color: rgba(255, 255, 255, 0.7);
            font-size: 12px;
            margin-top: 4px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        /* Hero band */
        .hero-band {
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            padding: 28px 40px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .hero-icon {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            flex-shrink: 0;
        }

        .hero-icon.blue {
            background: #dbeafe;
            color: #1a56db;
        }

        .hero-icon.green {
            background: #dcfce7;
            color: #16a34a;
        }

        .hero-icon.orange {
            background: #ffedd5;
            color: #ea580c;
        }

        .hero-icon.red {
            background: #fee2e2;
            color: #dc2626;
        }

        .hero-icon.purple {
            background: #f3e8ff;
            color: #9333ea;
        }

        .hero-band h1 {
            font-size: 20px;
            font-weight: 800;
            color: #0f172a;
        }

        .hero-band p {
            font-size: 14px;
            color: #64748b;
            margin-top: 2px;
        }

        /* Body */
        .email-body {
            padding: 36px 40px;
        }

        .greeting {
            font-size: 15px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 8px;
        }

        .message-text {
            font-size: 14px;
            color: #475569;
            line-height: 1.7;
            margin-bottom: 20px;
        }

        /* Info card */
        .info-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 20px 24px;
            margin: 20px 0;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #e2e8f0;
            font-size: 13px;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            color: #64748b;
            font-weight: 600;
        }

        .info-value {
            color: #0f172a;
            font-weight: 700;
        }

        /* CTA Button */
        .cta-wrap {
            text-align: center;
            margin: 28px 0;
        }

        .cta-btn {
            display: inline-block;
            background: linear-gradient(135deg, #1a56db 0%, #0e3fa3 100%);
            color: #ffffff !important;
            text-decoration: none;
            padding: 14px 36px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 14px;
            letter-spacing: 0.3px;
            box-shadow: 0 4px 14px rgba(26, 86, 219, 0.35);
        }

        /* Status badges */
        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 100px;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .badge-green {
            background: #dcfce7;
            color: #15803d;
        }

        .badge-blue {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .badge-red {
            background: #fee2e2;
            color: #b91c1c;
        }

        .badge-orange {
            background: #ffedd5;
            color: #c2410c;
        }

        .badge-slate {
            background: #f1f5f9;
            color: #475569;
        }

        /* Divider */
        .divider {
            border: none;
            border-top: 1px solid #e2e8f0;
            margin: 24px 0;
        }

        /* Footer */
        .email-footer {
            background: #f8fafc;
            border-top: 1px solid #e2e8f0;
            padding: 24px 40px;
            text-align: center;
        }

        .email-footer p {
            font-size: 12px;
            color: #94a3b8;
            line-height: 1.6;
        }

        .email-footer a {
            color: #1a56db;
            text-decoration: none;
            font-weight: 600;
        }

        .social-row {
            margin: 12px 0;
        }

        .social-row a {
            display: inline-block;
            width: 32px;
            height: 32px;
            background: #e2e8f0;
            border-radius: 8px;
            line-height: 32px;
            margin: 0 4px;
            font-size: 13px;
            color: #64748b !important;
            text-decoration: none;
        }

        /* Alert box */
        .alert {
            border-radius: 10px;
            padding: 14px 18px;
            font-size: 13px;
            margin: 16px 0;
        }

        .alert-info {
            background: #eff6ff;
            border-left: 4px solid #1a56db;
            color: #1e40af;
        }

        .alert-success {
            background: #f0fdf4;
            border-left: 4px solid #16a34a;
            color: #15803d;
        }

        .alert-warning {
            background: #fffbeb;
            border-left: 4px solid #f59e0b;
            color: #b45309;
        }

        .alert-danger {
            background: #fef2f2;
            border-left: 4px solid #dc2626;
            color: #b91c1c;
        }
    </style>
</head>

<body>
    <div class="wrapper">

        <!-- Header -->
        <div class="email-header">
            <div class="logo">Bros<span>Den</span>-AV</div>
            <div class="tagline">Smart Property Management Platform</div>
        </div>

        <!-- Content -->
        {% block email_content %}{% endblock %}

        <!-- Footer -->
        <div class="email-footer">
            <p>
                This is an automated message from <strong>BrosDen-AV</strong>.<br>
                Please do not reply directly to this email.<br>
                For support, <a href="mailto:aditya.raj322005@gmail.com">contact us here</a>.
            </p>
            <p style="margin-top: 12px;">© 2025 BrosDen-AV. All rights reserved.</p>
        </div>

    </div>
</body>

</html>
