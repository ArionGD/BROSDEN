<header class="bg-white border-b border-slate-200 py-5 px-12 md:px-20 flex items-center justify-between shadow-sm z-10">
    <div class="flex items-center gap-6">
        <a href="{% url 'index' %}" class="flex items-center no-underline group gap-2">
            <div
                class="flex items-center justify-center w-11 h-11 bg-indigo-600 rounded-xl text-white shadow-lg shadow-indigo-100 transform group-hover:rotate-6 transition-transform">
                <i class="fas fa-microchip text-sm"></i>
            </div>
            <div class="flex items-baseline">
                <span class="text-3xl font-black tracking-tighter text-slate-900">den</span>
                <span class="w-2 h-2 bg-indigo-500 rounded-full ml-1"></span>
            </div>
        </a>
        <div class="h-10 w-px bg-slate-200"></div>
        <div>
            <h1 class="text-xl font-black text-slate-900 tracking-tight">Command Center</h1>
            <p class="text-slate-500 font-bold mt-1 text-[10px] uppercase tracking-widest opacity-60">System Authority</p>
        </div>
    </div>

    <div class="flex items-center gap-4">
        <!-- Global Search -->
        <div class="relative hidden lg:block w-72">
            <input type="text" placeholder="Search matrix..." 
                   class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-100 rounded-xl text-xs font-bold focus:ring-4 focus:ring-indigo-100 outline-none transition-all placeholder:text-slate-300">
            <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-300 text-[10px]"></i>
        </div>

        <div class="h-10 w-px bg-slate-200 mx-2"></div>

        <div class="flex items-center gap-3">
            <div class="text-right hidden sm:block">
                <p class="text-sm font-bold text-slate-900">{{ user.username }}</p>
                <p class="text-[10px] font-black uppercase tracking-widest text-indigo-500">
                    <i class="fas fa-shield-halved mr-1"></i> Root Sentinel
                </p>
            </div>
            <div class="w-11 h-11 rounded-xl bg-indigo-600 flex items-center justify-center text-white font-black shadow-lg shadow-indigo-100">
                {{ user.username|slice:":1"|upper }}
            </div>
        </div>
    </div>
</header>
